              const newRecs = extracted.filter(r => !existingNames.has(r.name.toLowerCase()));
              const skipped = extracted.length - newRecs.length;
              if (newRecs.length === 0) {
                showToast(extracted.length ? 'Alla recept i PDF:en finns redan i boken.' : 'Hittade inga recept i PDF:en.');
                return;
              }
              setRecipes(prev => [...prev, ...newRecs]); 
              newRecs.forEach(r => saveRecipeToDb(r));
              showToast(`${newRecs.length} recept importerades!${skipped ? ` (${skipped} fanns redan)` : ''}`);
            } catch (err) {
              handleAiError(err, 'PDF-import:');
            } finally {
              setIsUploadingPdf(false);
              if (fileInputRef.current) fileInputRef.current.value = '';
            }
          };

          const handleGenerateInspiration = async () => {
            if (!inspirationQuery.trim()) return showToast("Skriv in en råvara eller idé först!");
            setIsGeneratingInspiration(true); setInspiredRecipe(null); showToast("Kocken skapar ett recept...");
            try {
              const data = await callGemini(`Du är en kock som lagar god svensk hemmamat. Skapa ett nytt recept baserat på: "${inspirationQuery.trim()}". ${RECIPE_RULES}`, null, null, recipeSchema, 0.9);
              setInspiredRecipe(normalizeRecipe(data, 'insp'));
              showToast("Receptet är klart!");
            } catch (err) {
              handleAiError(err, 'Inspiration:');
            } finally {
              setIsGeneratingInspiration(false);
            }
          };
          
          const saveInspiredRecipe = () => {
             if (!inspiredRecipe) return;
             setRecipes(prev => [inspiredRecipe, ...prev]);
             saveRecipeToDb(inspiredRecipe);
             setInspiredRecipe(null); 
             setInspirationQuery(''); 
             setActiveTab('recipes'); 
             showToast("Sparades i receptboken!");
          };

          // ---------------- Hushåll ----------------
          const joinHousehold = async (code) => {
            const newId = code.trim().toUpperCase();
            if (!newId) return false;
            if (newId === householdId) { showToast('Du är redan med i det hushållet.'); return true; }
            if (user && db) {
              try {
                const snap = await getDoc(doc(db, ...householdDocPath(newId)));
                if (!snap.exists()) { showToast('Hittade inget hushåll med den koden – kontrollera stavningen.'); return false; }
              } catch (err) {
                console.error('Kunde inte kontrollera koden:', err);
                showToast('Kunde inte kontrollera koden just nu. Försök igen.');
                return false;
              }
            }
            setHouseholdId(newId);
            showToast('Ansluten till hushållet!');
            return true;
          };

          // ---------------- Inköpslista ----------------
          const toggleChecked = (key) => {
            const next = { ...checkedListItems, [key]: !checkedListItems[key] };
            setCheckedListItems(next);
            updateSettingsInDb({ checkedListItems: next });
          };

          const addExtraItem = (e) => {
            if (e) e.preventDefault();
            const name = extraInput.trim();
            if (!name) return;
            const next = [...extraItems, { id: makeId('x'), name }];
            setExtraItems(next); setExtraInput('');
            updateSettingsInDb({ extraItems: next });
          };

          const removeExtraItem = (id) => {
            const next = extraItems.filter(i => i.id !== id);
            const nextChecked = { ...checkedListItems };
            delete nextChecked[`extra:${id}`];
            setExtraItems(next); setCheckedListItems(nextChecked);
            updateSettingsInDb({ extraItems: next, checkedListItems: nextChecked });
          };

          const hasCheckedExtras = extraItems.some(i => checkedListItems[`extra:${i.id}`]);
          const removeCheckedExtras = () => {
            const next = extraItems.filter(i => !checkedListItems[`extra:${i.id}`]);
            const nextChecked = { ...checkedListItems };
            extraItems.forEach(i => { delete nextChecked[`extra:${i.id}`]; });
            setExtraItems(next); setCheckedListItems(nextChecked);
            updateSettingsInDb({ extraItems: next, checkedListItems: nextChecked });
          };

          const handleCopyList = async () => {
            const lines = [];
            const openExtras = extraItems.filter(i => !checkedListItems[`extra:${i.id}`]);
            if (openExtras.length) lines.push('--- Egna varor ---', ...openExtras.map(i => i.name), '');
            shoppingList.forEach(([category, items]) => {
              const open = items.filter(i => !checkedListItems[i.name]);
              if (!open.length) return;
              lines.push(`--- ${category} ---`, ...open.map(i => { const amt = formatAmounts(i.amounts); return amt ? `${amt} ${i.name}` : i.name; }), '');
            });
            if (!lines.length) return showToast('Allt är redan avbockat – inget kvar att handla!');
            const ok = await copyText('Inköpslista:\n\n' + lines.join('\n').trim());
            showToast(ok ? 'Inköpslistan kopierades (bara det som inte är avbockat)!' : 'Kunde inte kopiera.');
          };

          // ---------------- Modal-data ----------------
          const modalRecipe = openRecipe ? (recipesById[openRecipe.id] || openRecipe.fallback) : null;
          const modalPlanDay = openRecipe?.planIndex != null ? mealPlan[openRecipe.planIndex] : null;
          const firstEmptyIndex = mealPlan.findIndex(d => !d.recipe && !isDayLocked(d) && (!d.date || d.date >= today));
          const pickerDay = pickerDayIndex !== null ? mealPlan[pickerDayIndex] : null;
          const editingRecipe = editingRecipeId ? recipesById[editingRecipeId] : null;
          const offsetWeekNumber = (offset) => getISOWeekInfo(addDays(getMonday(new Date()), offset * 7)).week;

          const openRecipeModal = (recipe, planIndex = null) => setOpenRecipe({ id: recipe.id, fallback: recipe, planIndex });

          return (
            <div className={isDarkMode ? 'dark' : ''}>
              <div className="min-h-screen font-sans text-slate-900 dark:text-slate-100 pb-24 md:pb-10 relative selection:bg-[#bacca0] dark:selection:bg-[#171f0d] transition-colors duration-300">
                <div className="fixed inset-0 -z-10 bg-slate-50 dark:bg-slate-900 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#e4ede0]/40 dark:from-[#171f0d]/20 via-slate-50 dark:via-slate-900 to-slate-100/60 dark:to-slate-950 transition-colors duration-300"></div>
                <input type="file" accept="image/*" ref={imageUploadRef} onChange={handleImageFileChange} className="hidden" />
                
                {toastMessage && (
                  <div className="fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-800 text-white px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-3 z-[60] animate-in fade-in slide-in-from-bottom-6 w-[90%] md:w-auto max-w-md border border-slate-700"><Info size={20} className="text-[#bacca0] flex-shrink-0" /><span className="font-medium text-sm">{toastMessage}</span></div>
                )}

                <header className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b sticky top-0 z-30 shadow-sm transition-colors duration-300 pt-safe">
                  <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                    <div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl shadow-md overflow-hidden bg-white dark:bg-slate-800 border flex-shrink-0 p-0.5"><RobotLogo /></div><h1 className="text-2xl font-extrabold dark:text-white tracking-tight hidden sm:block drop-shadow-sm">KockBot</h1></div>
                    <div className="hidden md:flex bg-slate-100/80 dark:bg-slate-800/80 p-1.5 rounded-full border shadow-inner">
                      {TABS.map(tab => { const Icon = tab.icon; return (
                        <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold transition-all active:scale-95 ${activeTab === tab.id ? 'bg-white dark:bg-slate-700 shadow-md text-[#526e35] dark:text-[#82a061]' : 'text-slate-500 dark:text-slate-400'}`}><Icon size={18} /> {tab.label}</button>
                      ); })}
                    </div>
                    <div className="flex items-center gap-2 ml-auto sm:ml-4">
                        <button onClick={() => setShowApiModal(true)} className="flex items-center justify-center p-2.5 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl border shadow-sm active:scale-95" title="API-nyckel"><Key size={18} /></button>
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="flex items-center justify-center p-2.5 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl border shadow-sm active:scale-95" title="Byt tema">{isDarkMode ? <Sun size={18} /> : <Moon size={18} />}</button>
                        <button onClick={() => setShowShareModal(true)} className="flex items-center justify-center gap-1.5 px-3 py-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-bold border shadow-sm active:scale-95"><Users size={16} className="text-[#526e35] dark:text-[#6a8a47]" /> <span className="hidden sm:inline">Dela</span></button>
                        {!isStandalone && <button onClick={installApp} className="flex items-center gap-1.5 px-3 py-2 bg-[#526e35] dark:bg-[#6a8a47] text-white rounded-xl text-xs font-bold shadow-md active:scale-95"><Download size={14} /> <span className="hidden sm:inline">Installera</span></button>}
                    </div>
                  </div>
                </header>

                <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t px-2 pt-2 pb-safe z-40 flex justify-between items-center shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                  {TABS.map(tab => { const Icon = tab.icon; const active = activeTab === tab.id; return (
                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center gap-1 flex-1 py-2 rounded-xl ${active ? 'text-[#526e35] dark:text-[#82a061] bg-[#f5f8f2]/50 dark:bg-[#171f0d]/20' : 'text-slate-400'}`}><Icon size={22} className={active ? 'fill-[#f5f8f2] dark:fill-[#171f0d]/50' : ''} /><span className="text-[10px] font-bold">{tab.short}</span></button>
                  ); })}
                </nav>

                <main className="max-w-4xl mx-auto px-4 py-8 md:py-12">
                  
                  {activeTab === 'plan' && (
                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                      {recipes.length === 0 && mealPlan.length === 0 ? (
                          <div className="text-center py-24 px-4 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-3xl border shadow-xl"><div className="bg-[#f5f8f2] dark:bg-[#171f0d]/30 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><BookOpen size={40} className="text-[#6a8a47]" /></div><h2 className="text-2xl font-extrabold mb-3">Din receptbok är tom</h2><p className="text-slate-500 mb-8 max-w-md mx-auto">Du måste lägga till recept innan vi kan hjälpa dig att bygga en matsedel.</p><button onClick={() => setActiveTab('recipes')} className="px-8 py-3.5 bg-[#526e35] text-white rounded-2xl font-bold shadow-lg">Gå till receptboken</button></div>
                      ) : mealPlan.length === 0 ? (
                          <div className="text-center py-24 px-4 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-3xl border shadow-xl"><div className="bg-[#f5f8f2] dark:bg-[#171f0d]/30 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><Calendar size={40} className="text-[#6a8a47]" /></div><h2 className="text-2xl font-extrabold mb-3">Ingen matsedel skapad ännu</h2><p className="text-slate-500 mb-8 max-w-md mx-auto">Välj hur många veckor du vill planera, med start denna vecka (v.{offsetWeekNumber(planStartOffset)}).</p>
                              <div className="flex flex-wrap justify-center gap-3"><button onClick={() => generatePlan('week')} className="px-6 py-3 bg-[#526e35] text-white rounded-2xl font-bold">1 vecka</button><button onClick={() => generatePlan('2weeks')} className="px-6 py-3 bg-[#526e35] text-white rounded-2xl font-bold">2 veckor</button><button onClick={() => generatePlan('3weeks')} className="px-6 py-3 bg-[#526e35] text-white rounded-2xl font-bold">3 veckor</button><button onClick={() => generatePlan('month')} className="px-6 py-3 bg-slate-900 dark:bg-slate-700 text-white rounded-2xl font-bold">4 veckor</button></div>
                          </div>
                      ) : (
                          <>
                              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 mb-6 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md p-6 sm:p-8 rounded-[2rem] border shadow-xl">
                                <div className="flex items-center gap-4"><div className="bg-[#e4ede0] dark:bg-[#171f0d]/40 p-3.5 rounded-2xl shadow-inner border border-[#f5f8f2] hidden sm:block"><Calendar size={28} className="text-[#526e35]" /></div><div><h2 className="text-2xl sm:text-3xl font-black drop-shadow-sm leading-tight">Din matsedel</h2><p className="text-slate-500 mt-1">Planera smart och spara tid.</p></div></div>
                                {!isPlanLocked ? (
                                  <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                                      <SelectBox label="Startvecka" value={planStartOffset} onChange={e => { const val = Number(e.target.value); setPlanStartOffset(val); updateSettingsInDb({ planStartOffset: val }); }}>
                                        <option value={0}>Denna vecka (v.{offsetWeekNumber(0)})</option>
                                        <option value={1}>Nästa vecka (v.{offsetWeekNumber(1)})</option>
                                        <option value={2}>Om 2 veckor (v.{offsetWeekNumber(2)})</option>
                                      </SelectBox>
                                      <SelectBox label="Antal veckor" value={planType} onChange={e => { setPlanType(e.target.value); updateSettingsInDb({ planType: e.target.value }); }}>
                                        <option value="week">1 vecka</option><option value="2weeks">2 veckor</option><option value="3weeks">3 veckor</option><option value="month">4 veckor</option>
                                      </SelectBox>
                                      <button onClick={() => generatePlan(planType)} className="flex-1 sm:flex-none px-6 py-3.5 bg-[#526e35] text-white rounded-2xl font-black text-sm active:scale-95 shadow-lg flex items-center justify-center gap-2"><RefreshCw size={16} strokeWidth={3} /> Slumpa</button>
                                  </div>
                                ) : (
                                  <div className="mt-4 md:mt-0 w-full md:w-auto"><button onClick={toggleLock} className="flex items-center gap-2 px-6 py-3.5 rounded-2xl text-sm font-black shadow-md border bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 w-full justify-center"><Lock size={16} strokeWidth={3} /> Matsedeln är låst – tryck för att låsa upp</button></div>
                                )}
                              </div>
                              {!isPlanLocked && (
                                <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-8">
                                  <p className="text-xs font-medium text-slate-500 dark:text-slate-400 px-1">Låsta veckor behålls när du slumpar om. Nya rätter upprepas inte i onödan.</p>
                                  <button onClick={toggleLock} className="flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm border bg-white dark:bg-slate-800 flex-shrink-0"><Unlock size={16} /> Lås hela matsedeln</button>
                                </div>
                              )}
                              <div className="space-y-12">
                                {planWeeks.map((group, weekIndex) => {
                                  const isThisWeekLocked = !!(group.lockKey && lockedWeeks[group.lockKey]);
                                  return (
                                    <div key={group.key} className="animate-in fade-in slide-in-from-bottom-4 duration-700" style={{ animationDelay: `${weekIndex * 100}ms` }}>
                                      <div className="flex items-center justify-between mb-5">
                                          <h3 className="text-xl font-extrabold text-slate-800 dark:text-white flex items-center gap-3">
                                            <span className="bg-slate-800 dark:bg-slate-700 text-white w-10 h-10 rounded-xl flex items-center justify-center text-sm shadow-md">V{group.weekNumber}</span> 
                                            Vecka {group.weekNumber}
                                          </h3>
                                          {!isPlanLocked && group.lockKey && (
                                            <button onClick={() => toggleWeekLock(group.lockKey, group.weekNumber)} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold shadow-sm border transition-colors active:scale-95 ${isThisWeekLocked ? 'bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800' : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
                                                {isThisWeekLocked ? <Lock size={16} strokeWidth={2.5} /> : <Unlock size={16} strokeWidth={2.5} />}
                                                <span className="hidden sm:inline">{isThisWeekLocked ? 'Veckan är låst' : 'Lås vecka'}</span>
                                            </button>
                                          )}
                                      </div>
                                      <div className="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md rounded-[2rem] shadow-xl border overflow-hidden">
                                        <div className="divide-y divide-slate-100/80 dark:divide-slate-700/50">
                                          {group.days.map(({ day, index }) => {
                                            const recipe = resolveRecipe(day.recipe);
                                            const isToday = day.date === today;
                                            const isPast = !!day.date && day.date < today;
                                            const canEdit = !isPlanLocked && !isThisWeekLocked;
                                            return (
                                              <div key={index} className={`p-4 sm:p-6 flex items-center justify-between gap-3 transition-all duration-300 ${isToday ? 'bg-[#f5f8f2] dark:bg-[#171f0d]/40' : recipe ? 'hover:bg-slate-50/50 dark:hover:bg-slate-700/30' : 'bg-slate-50/30 dark:bg-slate-900/30'} ${isPast ? 'opacity-60' : ''}`}>
                                                <div className="w-16 sm:w-24 flex-shrink-0">
                                                  <p className="font-black text-sm sm:text-base">{day.dayName}</p>
                                                  {day.date && <p className={`text-xs font-bold ${isToday ? 'text-[#526e35] dark:text-[#82a061]' : 'text-slate-400'}`}>{isToday ? 'Idag' : formatShortDate(day.date)}</p>}
                                                </div>
                                                {recipe ? (
                                                  <button type="button" onClick={() => openRecipeModal(recipe, index)} className="flex-1 min-w-0 text-left group flex items-center gap-2">
                                                    <span className="truncate font-bold text-base sm:text-lg group-hover:text-[#526e35] dark:group-hover:text-[#82a061]">{recipe.name}</span>
                                                    <ExternalLink size={16} className="opacity-0 group-hover:opacity-100 hidden sm:block flex-shrink-0" />
                                                  </button>
                                                ) : (
                                                  <p className="flex-1 min-w-0 text-left font-medium text-base sm:text-lg italic opacity-60">Inget planerat</p>
                                                )}
                                                <div className="flex items-center gap-3 sm:gap-4 flex-shrink-0">
                                                  {recipe && <div className="hidden sm:block"><CatBadge protein={recipe.protein} /></div>}
                                                  {canEdit && (
                                                    <div className="flex items-center gap-1.5 sm:gap-2 bg-slate-100/80 dark:bg-slate-900/50 p-1.5 rounded-2xl border shadow-sm">
                                                      {recipe ? (
                                                        <>
                                                          <button onClick={() => setPickerDayIndex(index)} title="Välj rätt själv" className="hidden sm:inline-flex p-2.5 bg-white dark:bg-slate-800 rounded-xl active:scale-95 shadow-sm border"><Search size={16} strokeWidth={2.5} /></button>
                                                          <button onClick={() => swapDayRecipe(index)} title="Slumpa ny rätt" className="p-2 sm:p-2.5 bg-white dark:bg-slate-800 rounded-xl active:scale-95 shadow-sm border"><RefreshCw size={16} strokeWidth={2.5} /></button>
                                                          <button onClick={() => clearDayRecipe(index)} title="Töm dagen" className="p-2 sm:p-2.5 bg-white dark:bg-slate-800 text-red-400 rounded-xl active:scale-95 shadow-sm border"><X size={16} strokeWidth={2.5} /></button>
                                                        </>
                                                      ) : (
                                                        <button onClick={() => setPickerDayIndex(index)} className="px-4 py-2.5 bg-white dark:bg-slate-800 text-[#526e35] dark:text-[#82a061] rounded-xl active:scale-95 shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-1.5">
                                                          <Plus size={16} strokeWidth={3} /> <span className="text-xs font-extrabold hidden sm:inline">Välj manuellt</span>
                                                        </button>
                                                      )}
                                                    </div>
                                                  )}
                                                </div>
                                              </div>
                                            );
                                          })}
                                        </div>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                          </>
                      )}
                    </div>
                  )}

                  {activeTab === 'list' && (
                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 max-w-3xl mx-auto">
                      <div className="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-[2rem] shadow-xl border p-6 sm:p-8 mb-6">
                        <div className="flex flex-col sm:flex-row justify-between sm:items-end gap-6 mb-6 border-b pb-6">
                          <div>
                            <h2 className="text-3xl font-black mb-2 drop-shadow-sm">Inköpslista</h2>
                            <p className="text-slate-500 text-sm font-medium">
                              {mealPlan.length === 0
                                ? 'Ingen matsedel ännu – du kan ändå lägga till egna varor nedan.'
                                : `Underlag: ${shoppingDays.length} ${shoppingDays.length === 1 ? 'middag' : 'middagar'} ${listScope === 'upcoming' ? 'från idag och framåt' : 'i hela matsedeln'}.`}
                            </p>
                          </div>
                          <button onClick={handleCopyList} className="flex items-center justify-center gap-2 px-6 py-3 bg-[#526e35] text-white font-bold rounded-2xl text-sm shadow-lg active:scale-95"><Copy size={18} /> Kopiera lista</button>
                        </div>

                        {mealPlan.length > 0 && (
                          <div className="flex bg-slate-100/80 dark:bg-slate-900/50 p-1 rounded-2xl border mb-8 w-full sm:w-auto sm:inline-flex">
                            <button onClick={() => setListScope('upcoming')} className={`flex-1 sm:flex-none px-4 py-2 rounded-xl text-sm font-bold transition-all ${listScope === 'upcoming' ? 'bg-white dark:bg-slate-700 shadow text-[#526e35] dark:text-[#82a061]' : 'text-slate-500'}`}>Från idag</button>
                            <button onClick={() => setListScope('all')} className={`flex-1 sm:flex-none px-4 py-2 rounded-xl text-sm font-bold transition-all ${listScope === 'all' ? 'bg-white dark:bg-slate-700 shadow text-[#526e35] dark:text-[#82a061]' : 'text-slate-500'}`}>Hela matsedeln</button>
                          </div>
                        )}

                        <div className="space-y-8">
                          <div className="space-y-3">
                            <div className="flex items-center justify-between border-b pb-2 pl-1">
                              <h3 className="font-bold text-[#526e35] dark:text-[#82a061] uppercase tracking-widest text-xs">Egna varor</h3>
                              {hasCheckedExtras && <button onClick={removeCheckedExtras} className="text-xs font-bold text-slate-400 hover:text-red-500">Ta bort avbockade</button>}
                            </div>
                            <form onSubmit={addExtraItem} className="flex gap-2">
                              <input type="text" value={extraInput} onChange={e => setExtraInput(e.target.value)} placeholder="T.ex. mjölk, kaffe, toapapper..." className="flex-1 min-w-0 px-4 py-3 bg-white dark:bg-slate-900 border rounded-xl outline-none text-sm font-medium focus:ring-2 focus:ring-[#6a8a47]" />
                              <button type="submit" disabled={!extraInput.trim()} className="px-4 py-3 bg-[#526e35] text-white rounded-xl font-bold text-sm flex items-center gap-1.5 disabled:opacity-50 active:scale-95"><Plus size={16} strokeWidth={3} /> <span className="hidden sm:inline">Lägg till</span></button>
                            </form>
                            {extraItems.map(item => (
                              <ListRow key={item.id} compact name={item.name} checked={!!checkedListItems[`extra:${item.id}`]} onToggle={() => toggleChecked(`extra:${item.id}`)}>
                                <button onClick={() => removeExtraItem(item.id)} className="p-2 text-slate-400 hover:text-red-500" title="Ta bort"><X size={18} /></button>
                              </ListRow>
                            ))}
                          </div>

                          {shoppingList.map(([category, items]) => (
                            <div key={category} className="space-y-3">
                              <h3 className="font-bold text-[#526e35] dark:text-[#82a061] border-b pb-2 pl-1 uppercase tracking-widest text-xs">{category}</h3>
                              {items.map(item => {
                                const amounts = formatAmounts(item.amounts);
                                return (
                                  <ListRow key={item.name} name={item.name} checked={!!checkedListItems[item.name]} onToggle={() => toggleChecked(item.name)}>
                                    <span className="font-bold bg-slate-100/80 dark:bg-slate-900/50 px-4 py-2 rounded-xl text-sm whitespace-nowrap shadow-sm border">{amounts || 'Efter behov'}</span>
                                    <a href={`${ICA_SEARCH_URL}${encodeURIComponent(item.name)}`} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1.5 px-4 py-2 text-xs font-extrabold text-red-600 bg-red-50 dark:bg-red-900/30 dark:text-red-400 rounded-xl border active:scale-95 shadow-sm" onClick={(e) => e.stopPropagation()}><ExternalLink size={14} /> ICA</a>
                                  </ListRow>
                                );
                              })}
                            </div>
                          ))}

                          {mealPlan.length > 0 && shoppingList.length === 0 && (
                            <p className="text-center text-slate-500 font-medium py-6">Inga ingredienser för vald period.{listScope === 'upcoming' ? ' Välj "Hela matsedeln" för att se allt.' : ''}</p>
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'recipes' && (
                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-5 mb-8 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md p-6 sm:p-8 rounded-[2rem] border shadow-xl">
                        <div><h2 className="text-3xl font-black drop-shadow-sm">Receptbok</h2><p className="text-slate-500 font-medium mt-1">{recipes.length} {recipes.length === 1 ? 'favorit' : 'favoriter'} samlade.</p></div>
                        <div className="flex flex-wrap gap-3 w-full md:w-auto">
                          <button onClick={() => setShowAddModal(true)} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-3.5 bg-[#526e35] text-white rounded-2xl font-bold text-sm shadow-lg active:scale-95"><Plus size={18} strokeWidth={3} /> Nytt recept</button>
                          <div className="relative flex-1 md:flex-none">
                            <input type="file" accept="application/pdf" ref={fileInputRef} onChange={handlePdfUpload} className="hidden" id="pdf-upload" disabled={isUploadingPdf} />
                            <label htmlFor="pdf-upload" className={`flex items-center justify-center gap-2 px-6 py-3.5 ${isUploadingPdf ? 'bg-slate-100 dark:bg-slate-700 text-slate-400' : 'bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 cursor-pointer shadow-sm active:scale-95'} rounded-2xl font-bold text-sm w-full`}>{isUploadingPdf ? <Loader2 size={18} className="animate-spin" /> : <Upload size={18} />} {isUploadingPdf ? 'Läser in...' : 'Importera PDF'}</label>
                          </div>
                        </div>
                      </div>

                      <div className="mb-6 relative max-w-lg">
                        <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={20} />
                        <input 
                           type="text" 
                           placeholder="Sök på recept eller ingrediens..." 
                           value={recipeSearchQuery} 
                           onChange={(e) => setRecipeSearchQuery(e.target.value)}
                           className="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm focus:ring-2 focus:ring-[#6a8a47] outline-none text-slate-800 dark:text-slate-100 font-medium" 
                        />
                      </div>

                      {recipes.length > 0 && (
                          <div className="flex overflow-x-auto hide-scrollbar gap-3 mb-8 pb-2 -mx-4 px-4 sm:mx-0 sm:px-0">
                              {BOOK_COLLECTIONS.map(cat => ( <button key={cat} onClick={() => setSelectedCollection(cat)} className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-extrabold whitespace-nowrap border shadow-sm active:scale-95 ${selectedCollection === cat ? 'bg-slate-800 dark:bg-[#526e35] text-white' : 'bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300'}`}>{cat === 'Alla' && <Filter size={16} />} {cat}</button> ))}
                          </div>
                      )}
                      {filteredRecipes.length === 0 ? (
                           <div className="text-center py-20 px-4 bg-white/50 dark:bg-slate-800/50 border-2 border-dashed rounded-3xl backdrop-blur-sm"><p className="text-slate-500 font-medium text-lg">Inga recept hittades.</p></div>
                      ) : (
                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                          {filteredRecipes.map((recipe, index) => (
                              <div key={recipe.id} className="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-[2rem] shadow-lg border flex flex-col hover:shadow-2xl hover:-translate-y-1.5 duration-300 group cursor-pointer relative overflow-hidden animate-in fade-in" style={{ animationDelay: `${(index % 10) * 50}ms` }} onClick={() => openRecipeModal(recipe)}>
                                <div className="h-40 w-full bg-slate-100 dark:bg-slate-700 relative overflow-hidden flex-shrink-0">
                                    <img src={getRecipeImage(recipe)} alt={recipe.name} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 duration-700" onError={(e) => { e.target.onerror = null; e.target.src = getFallbackImage(recipe.id); }} />
                                    <div className="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white/90 dark:from-slate-800/90 to-transparent"></div>
                                </div>
                                <div className="p-6 flex flex-col flex-1">
                                    <div className="flex justify-between items-center mb-4 pr-8"><span className="text-[10px] font-extrabold text-[#526e35] dark:text-[#82a061] bg-[#f5f8f2] dark:bg-[#171f0d]/40 px-2 py-1 rounded-md uppercase tracking-widest border">{recipe.collection}</span></div>
                                    <h3 className="font-black text-xl mb-6 leading-tight group-hover:text-[#6a8a47] transition-colors drop-shadow-sm">{recipe.name}</h3>
                                    <div className="mt-auto pt-5 flex justify-between items-center border-t border-slate-100/80 dark:border-slate-700/80"><CatBadge protein={recipe.protein} />{recipe.time && <span className="text-slate-500 text-xs font-bold flex items-center gap-1.5 bg-slate-50 dark:bg-slate-900/50 px-2 py-1 rounded-md border"><Clock size={14}/>{recipe.time}</span>}</div>
                                </div>
                              </div>
                          ))}
                          </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'inspiration' && (
                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 max-w-2xl mx-auto">
                      <div className="text-center mb-8 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md p-8 rounded-3xl border shadow-xl"><div className="bg-[#e4ede0] dark:bg-[#171f0d]/40 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border"><Sparkles size={36} className="text-[#526e35]" /></div><h2 className="text-3xl font-extrabold mb-3 drop-shadow-sm">Ny inspiration</h2><p className="text-slate-500 font-medium">Skriv in en råvara du har hemma eller något du är sugen på, så hittar AI-kocken på ett helt nytt recept åt dig.</p></div>
                      <div className="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-3 sm:p-4 rounded-3xl shadow-lg border mb-8 flex flex-col sm:flex-row gap-3 relative z-10">
                        <input type="text" value={inspirationQuery} onChange={(e) => setInspirationQuery(e.target.value)} placeholder="T.ex. Vegetariskt med sötpotatis..." className="flex-1 min-w-0 px-6 py-4 bg-slate-50/50 dark:bg-slate-900/50 border rounded-2xl outline-none text-lg font-medium shadow-inner" onKeyDown={(e) => e.key === 'Enter' && !isGeneratingInspiration && handleGenerateInspiration()} />
                        <button onClick={handleGenerateInspiration} disabled={isGeneratingInspiration} className="px-8 py-4 bg-[#526e35] text-white rounded-2xl font-bold flex items-center justify-center gap-2 disabled:opacity-70 shadow-md active:scale-95 text-lg">{isGeneratingInspiration ? <Loader2 size={20} className="animate-spin" /> : <Sparkles size={20} />} Skapa recept</button>
                      </div>
                      {inspiredRecipe && (
                        <div className="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-[2rem] shadow-2xl overflow-hidden border animate-in zoom-in-95 duration-500 relative">
                          <div className="p-6 sm:p-8">
                            <span className="text-xs font-bold text-[#526e35] dark:text-[#82a061] bg-[#f5f8f2] dark:bg-[#171f0d]/40 px-3 py-1 rounded-md border uppercase tracking-widest mb-4 inline-block">{inspiredRecipe.collection}</span>
                            <h2 className="text-3xl sm:text-4xl font-black leading-tight mb-6 drop-shadow-sm">{inspiredRecipe.name}</h2>
                            <div className="w-full h-48 sm:h-80 bg-slate-100 dark:bg-slate-700 rounded-3xl mb-8 overflow-hidden relative shadow-inner border"><img src={getRecipeImage(inspiredRecipe)} alt={inspiredRecipe.name} className="w-full h-full object-cover animate-in fade-in" onError={(e) => { e.target.onerror = null; e.target.src = getFallbackImage(inspiredRecipe.id); }} /></div>
                            <div className="flex items-center gap-4 text-sm font-medium text-slate-500 mb-8 pb-6 border-b"><CatBadge protein={inspiredRecipe.protein} />{inspiredRecipe.time && <span className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-900/50 px-3 py-1.5 rounded-lg border"><Clock size={18}/> {inspiredRecipe.time}</span>}</div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                              <div className="bg-[#f5f8f2]/50 dark:bg-[#171f0d]/20 p-6 rounded-3xl border shadow-sm"><h3 className="font-extrabold mb-5 flex items-center gap-2 text-lg"><ShoppingCart size={20} className="text-[#526e35]"/> Ingredienser</h3><ul className="space-y-3 text-sm">{inspiredRecipe.ingredients.map((ing, i) => (<li key={i} className="flex justify-between gap-3 border-b pb-2 items-center"><span className="font-medium text-base">{ing.name}</span>{(ing.amount || ing.unit) ? <span className="font-bold text-[#3d5226] dark:text-[#9eb582] bg-white dark:bg-slate-800 px-3 py-1 rounded-lg shadow-sm border whitespace-nowrap">{ing.amount ? String(ing.amount).replace('.', ',') : ''} {ing.unit}</span> : null}</li>))}</ul></div>
                              <div><h3 className="font-extrabold mb-5 flex items-center gap-2 text-lg"><Utensils size={20} className="text-[#526e35]"/> Tillagning</h3><div className="space-y-4">{parseInstructionsText(inspiredRecipe.instructions).map((step, idx) => (<div key={idx} className="flex gap-4 p-4 bg-slate-50 dark:bg-slate-700 rounded-2xl border shadow-sm items-start"><span className="flex-shrink-0 w-8 h-8 flex items-center justify-center bg-white dark:bg-slate-800 rounded-full text-[#526e35] dark:text-[#82a061] font-bold border shadow-sm">{idx + 1}</span><p className="pt-1 leading-relaxed font-medium">{step}</p></div>))}</div></div>
                            </div>
                            <button onClick={saveInspiredRecipe} className="w-full px-6 py-5 bg-slate-900 dark:bg-[#526e35] text-white rounded-2xl font-bold flex items-center justify-center gap-3 shadow-xl active:scale-95 text-lg"><Save size={24} /> Spara till min receptbok</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </main>

                <ApiModal open={showApiModal} onClose={() => setShowApiModal(false)} showToast={showToast} />
                <ShareModal
                  open={showShareModal}
                  onClose={() => setShowShareModal(false)}
                  householdId={householdId}
                  onJoin={joinHousehold}
                  onCopy={async () => { const ok = await copyText(householdId); showToast(ok ? 'Koden kopierades!' : 'Kunde inte kopiera.'); }}
                />
                {modalRecipe && (
                  <RecipeModal
                    key={modalRecipe.id}
                    recipe={modalRecipe}
                    isInBook={!!recipesById[modalRecipe.id]}
                    onClose={() => setOpenRecipe(null)}
                    onDelete={deleteRecipe}
                    onEdit={(r) => { setEditingRecipeId(r.id); setOpenRecipe(null); }}
                    onUploadImage={triggerImageUpload}
                    pickOtherLabel={modalPlanDay ? dayLabel(modalPlanDay) : ''}
                    onPickOther={modalPlanDay && !isDayLocked(modalPlanDay) ? () => { setPickerDayIndex(openRecipe.planIndex); setOpenRecipe(null); } : null}
                    addTargetLabel={firstEmptyIndex !== -1 ? dayLabel(mealPlan[firstEmptyIndex]) : ''}
                    onAddToDay={!modalPlanDay && firstEmptyIndex !== -1 ? () => {
                      const day = mealPlan[firstEmptyIndex];
                      setDayRecipe(firstEmptyIndex, modalRecipe);
                      setOpenRecipe(null);
                      showToast(`Receptet lades till på ${dayLabel(day)}!`);
                    } : null}
                  />
                )}
                {(showAddModal || editingRecipe) && (
                  <AddRecipeModal
                    key={editingRecipeId || 'new'}
                    recipeToEdit={editingRecipe}
                    onClose={closeAddModal}
                    onSave={handleSaveRecipe}
                    showToast={showToast}
                    onApiKeyError={() => setShowApiModal(true)}
                  />
                )}
                {pickerDay && (
                  <DayRecipePickerModal
                    day={pickerDay}
                    recipes={recipes}
                    onClose={() => setPickerDayIndex(null)}
                    onSelect={(recipe) => {
                      setDayRecipe(pickerDayIndex, recipe);
                      showToast(`${recipe.name} lades till på ${dayLabel(pickerDay)}!`);
                      setPickerDayIndex(null);
                    }}
                  />
                )}
              </div>
            </div>
          );
        };

        // --- FELHANTERING (förhindrar vita skärmar) ---
        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }
          static getDerivedStateFromError(error) {
            return { hasError: true, error };
          }
          resetLocalData() {
            // Behåll hushållskod, tema och API-nyckel – annars tappar man kopplingen till familjens data
            const keep = ['householdId', 'theme', 'apiKey'];
            try {
              const saved = keep.map(k => [k, localStorage.getItem(LS_PREFIX + k)]);
              localStorage.clear();
              saved.forEach(([k, v]) => { if (v !== null) localStorage.setItem(LS_PREFIX + k, v); });
            } catch (e) {}
            window.location.reload();
          }
          render() {
            if (this.state.hasError) {
              return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6 font-sans">
                  <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center border border-red-100">
                    <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                    <h2 className="text-xl font-bold text-slate-800 mb-2">Oj, något gick snett!</h2>
                    <p className="text-slate-500 mb-6 text-sm">Appen stötte på ett oväntat fel, troligen på grund av ofullständig data i minnet.</p>
                    <p className="text-[10px] text-red-400 bg-red-50 p-3 rounded-lg mb-6 text-left overflow-auto font-mono max-h-32">
                      {this.state.error?.toString()}
                    </p>
                    <button 
                      onClick={() => this.resetLocalData()} 
                      className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl active:scale-95 transition-all shadow-md"
                    >
                      Rensa minnet och starta om
                    </button>
                    <p className="text-[10px] text-slate-400 mt-4">Hushållskoden behålls, så dina recept hämtas från molnet igen.</p>
                  </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
