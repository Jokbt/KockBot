<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Calendar, ShoppingCart, BookOpen, RefreshCw, Info, 
          X, Plus, Upload, Trash2, Save, Users,
          Loader2, Copy, Check, Utensils, ExternalLink, Filter, Camera, Sparkles, Download, Lock, Unlock, ChevronDown, ImagePlus, Sun, Moon, Key, Edit, Search, CalendarPlus, Clock
        } from 'lucide-react';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // =========================================================================
        // API OCH FIREBASE CONFIG
        // =========================================================================
        // Tom nyckel fungerar bara inne i Gemini Canvas. På egen hemsida läggs nyckeln in via 🔑-knappen.
        const apiKey = ""; 

        const myFirebaseConfig = {
          apiKey: "AIzaSyANEkApp6RLf2dXSiIu_cE5wyDp1dSZuRk",
          authDomain: "kockbot-f0e5f.firebaseapp.com",
          projectId: "kockbot-f0e5f",
          storageBucket: "kockbot-f0e5f.firebasestorage.app",
          messagingSenderId: "132836094378",
          appId: "1:132836094378:web:98106b8982f6c47f61bbd3",
          measurementId: "G-DDW0GD700Z"
        }; 

        let auth = null;
        let db = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kockbot-live';

        try {
          const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
          const isDummyKey = myFirebaseConfig && myFirebaseConfig.apiKey && myFirebaseConfig.apiKey.includes("DIN_EGEN");
          const finalConfig = (myFirebaseConfig && myFirebaseConfig.apiKey && !isDummyKey) ? myFirebaseConfig : (configStr ? JSON.parse(configStr) : null);
          
          if (finalConfig && Object.keys(finalConfig).length > 0) {
            const app = initializeApp(finalConfig);
            auth = getAuth(app);
            db = getFirestore(app);
          }
        } catch (err) {
          console.error("Kunde inte initiera databasen:", err);
        }

        const householdDocPath = (id) => ['artifacts', appId, 'public', 'data', 'households', id];

        // =========================================================================
        // KONSTANTER
        // =========================================================================
        const DAYS = ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag', 'Söndag'];
        const BOOK_COLLECTIONS = ['Alla', 'Spaghetti- & pastarätter', 'Potatisrätter', 'Risrätter', 'Soppor', 'Övriga vardagsrätter', 'Helgmat'];
        const RECIPE_COLLECTIONS = BOOK_COLLECTIONS.filter(c => c !== 'Alla');
        const PROTEINS = ['kött', 'fisk', 'veg', 'kyckling'];
        const WEEKS_BY_PLAN_TYPE = { week: 1, '2weeks': 2, '3weeks': 3, month: 4 };
        const SHOPPING_CATEGORIES = ['Frukt & Grönt', 'Kött, Fågel & Fisk', 'Mejeri & Ägg', 'Skafferi', 'Bröd & Bageri', 'Övrigt'];
        const ICA_SEARCH_URL = 'https://handlaprivatkund.ica.se/stores/1004243/search?q=';
        const GEMINI_MODEL = 'gemini-flash-latest'; // Alias som Google håller uppdaterat till senaste Flash-modellen

        const TABS = [
          { id: 'plan', label: 'Matsedel', short: 'Matsedel', icon: Calendar },
          { id: 'list', label: 'Inköpslista', short: 'Handla', icon: ShoppingCart },
          { id: 'recipes', label: 'Recept', short: 'Recept', icon: BookOpen },
          { id: 'inspiration', label: 'Inspiration', short: 'Inspo', icon: Sparkles },
        ];

        // =========================================================================
        // LOKAL LAGRING
        // =========================================================================
        const LS_PREFIX = 'smartMatsedel_';
        const lsGet = (key, fallback = null) => {
          try { const v = localStorage.getItem(LS_PREFIX + key); return v === null ? fallback : v; } catch (e) { return fallback; }
        };
        const lsSet = (key, value) => {
          try { localStorage.setItem(LS_PREFIX + key, value); } catch (e) { console.warn('Lokal lagring full eller blockerad:', key); }
        };
        const lsGetJSON = (key, fallback, isValid) => {
          try { const v = JSON.parse(localStorage.getItem(LS_PREFIX + key)); return isValid(v) ? v : fallback; } catch (e) { return fallback; }
        };
        const isArray = (v) => Array.isArray(v);
        const isObject = (v) => typeof v === 'object' && v !== null && !Array.isArray(v);

        // =========================================================================
        // DATUM
        // =========================================================================
        const getISOWeekInfo = (date) => {
          const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
          const dayNum = d.getUTCDay() || 7;
          d.setUTCDate(d.getUTCDate() + 4 - dayNum);
          const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
          return { year: d.getUTCFullYear(), week: Math.ceil((((d - yearStart) / 86400000) + 1) / 7) };
        };
        const weekKeyOf = (date) => { const { year, week } = getISOWeekInfo(date); return `${year}-${week}`; };
        const getMonday = (date) => {
          const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
          const day = d.getDay() || 7;
          d.setDate(d.getDate() - (day - 1));
          return d;
        };
        const addDays = (date, n) => { const d = new Date(date); d.setDate(d.getDate() + n); return d; };
        const toISODate = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        const todayISO = () => toISODate(new Date());
        const formatShortDate = (iso) => { if (!iso) return ''; const [, m, d] = iso.split('-').map(Number); return `${d}/${m}`; };
        const dayLabel = (day) => day.date ? `${day.dayName.toLowerCase()} ${formatShortDate(day.date)}` : `${day.dayName.toLowerCase()} (v.${day.weekNumber})`;

        // =========================================================================
        // HJÄLPFUNKTIONER
        // =========================================================================
        const shuffleArray = (array) => {
          let currentIndex = array.length, randomIndex;
          while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
          }
          return array;
        };

        // Undviker förväxlingsbara tecken (0/O, 1/I) och ger alltid 6 tecken
        const generateHouseholdId = () => {
          const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          let id = '';
          for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
          return id;
        };

        const makeId = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        // Firestore vägrar spara fält med värdet undefined – rensa bort dem innan sparning
        const toFirestore = (obj) => JSON.parse(JSON.stringify(obj));
        const stripImage = (recipe) => { if (!recipe) return null; const { customImage, ...rest } = recipe; return rest; };
        const parseAmount = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
        const shortError = (err) => (err?.message || 'okänt fel').slice(0, 70);

        const normalizeProtein = (p) => {
          const s = String(p || '').toLowerCase().trim();
          if (PROTEINS.includes(s)) return s;
          if (s.startsWith('veg')) return 'veg';
          if (/(kyckling|fågel|kalkon)/.test(s)) return 'kyckling';
          if (/(fisk|skaldjur|lax|torsk|räk)/.test(s)) return 'fisk';
          if (/(kött|fläsk|nöt|lamm|färs|vilt)/.test(s)) return 'kött';
          return 'veg';
        };

        // Säkerställer att recept (från AI, PDF eller gammal data) har alla fält i rätt format
        const normalizeRecipe = (r, idPrefix) => ({
          ...r,
          id: r.id || makeId(idPrefix),
          name: String(r.name || 'Namnlöst recept').trim(),
          protein: normalizeProtein(r.protein),
          collection: RECIPE_COLLECTIONS.includes(r.collection) ? r.collection : 'Övriga vardagsrätter',
          time: r.time ? String(r.time) : '',
          ingredients: isArray(r.ingredients)
            ? r.ingredients.filter(i => i && i.name).map(i => ({ name: String(i.name).trim(), amount: parseAmount(i.amount), unit: String(i.unit || '').trim() }))
            : [],
          instructions: isArray(r.instructions) ? r.instructions.join('\n') : String(r.instructions || ''),
        });

        // ---- Regler för matsedeln ----
        const dayRuleFor = (dayOfWeek, weekdayProteins) => {
          if (dayOfWeek < 4) return { protein: weekdayProteins[dayOfWeek], collection: '' };       // mån–tor
          if (dayOfWeek === 4 || dayOfWeek === 5) return { protein: '', collection: 'Helgmat' };    // fre–lör
          return { protein: Math.random() > 0.5 ? 'kött' : 'kyckling', collection: '' };            // sön
        };
        // Vardagar (mån–tor) väljer helst rätter som inte är "Helgmat"
        const ruleForDay = (day) => {
          const dayOfWeek = (day.dayIndex ?? 0) % 7;
          let rule;
          if (day.targetProteinMarker || day.targetCollectionMarker) {
            rule = { protein: day.targetProteinMarker || '', collection: day.targetCollectionMarker || '' };
          } else if (dayOfWeek === 4 || dayOfWeek === 5) {
            rule = { protein: '', collection: 'Helgmat' };
          } else if (dayOfWeek === 6) {
            rule = { protein: Math.random() > 0.5 ? 'kött' : 'kyckling', collection: '' };
          } else {
            rule = { protein: normalizeProtein(day.recipe?.protein || 'kött'), collection: '' };
          }
          return { ...rule, avoidCollection: dayOfWeek < 4 ? 'Helgmat' : '' };
        };
        const matchesRule = (recipe, rule) => {
          if (rule.collection) return recipe.collection === rule.collection;
          if (rule.protein) return normalizeProtein(recipe.protein) === rule.protein;
          return true;
        };
        // Väljer ett recept som passar dagens regel och som använts minst hittills (undviker upprepningar)
        const pickRecipe = (recipes, rule, usage = {}, excludeId = null) => {
          const withoutExcluded = recipes.filter(r => r.id !== excludeId);
          const base = withoutExcluded.length ? withoutExcluded : recipes;
          const matching = base.filter(r => matchesRule(r, rule));
          const preferred = rule.avoidCollection ? matching.filter(r => r.collection !== rule.avoidCollection) : matching;
          const pool = preferred.length ? preferred : matching.length ? matching : base;
          if (!pool.length) return null;
          const minUse = Math.min(...pool.map(r => usage[r.id] || 0));
          const leastUsed = pool.filter(r => (usage[r.id] || 0) === minUse);
          return leastUsed[Math.floor(Math.random() * leastUsed.length)];
        };

        // ---- Inköpslistan ----
        const CATEGORY_RULES = [
          // Burkar, buljong m.m. först – annars hamnar t.ex. "kycklingbuljong" bland kött och "krossade tomater" bland grönt
          ['Skafferi', /(buljong|fond|tärning|puré|krossade|passerade|konserv|kokos|sojasås|ostronsås|fisksås|pulver|torkad|nudlar|pasta|spaghetti|lasagne|ströbröd|panko|mjöl(?!k)|kikärt|kycklingärt|bönor|linser)/],
          ['Bröd & Bageri', /(bröd|tortilla|pita|baguette|franska|knäcke|naan|wrap)/],
          ['Kött, Fågel & Fisk', /(färs(?!k)|kyckling|kött|korv|pancetta|salami|lax|torsk|sej|kolja|räk|fläsk|biff|filé|skinka|chorizo|kalkon|bacon|prosciutto|skaldjur|fisk|lamm|kalv|älg|hjort|vilt|anka|entrecote|entrecôte|kassler|högrev|karré|musslor)/],
          ['Mejeri & Ägg', /(mjölk|grädde|smör|(^|[^r])ost(?!ron)|parmesan|pecorino|mozzarella|halloumi|creme fraiche|crème|ägg|feta|färskost|mascarpone|burrata|yoghurt|kvarg|margarin|keso|kesella|ricotta|cheddar)/],
          ['Frukt & Grönt', /(lök|tomat|morot|potatis|spenat|persilja|basilika|svamp|champinjon|paprika|chili|citron|lime|broccoli|äpple|banan|sallad|gurka|purjolök|timjan|oregano|rosmarin|dill|koriander|avokado|zucchini|aubergine|kål|palsternacka|rotfrukt|ingefära|frukt|bär|ärtor|sparris|selleri|rödbet|squash|pumpa|majs)/],
          ['Skafferi', /(ris|buljong|soja|olja|salt|peppar|socker|sirap|senap|honung|vinäger|nötter|frön|krydda|kryddor|kanel|kardemumma|spiskummin|paprikapulver|kakao|vanilj|balsamico|maizena|stärkelse|ketchup|chilisås|sambal|bakpulver|jäst)/],
        ];
        const getCategory = (name) => {
          const n = String(name || '').toLowerCase();
          for (const [category, regex] of CATEGORY_RULES) if (regex.test(n)) return category;
          return 'Övrigt';
        };

        const SKIP_INGREDIENTS = /^(vatten|kallt vatten|varmt vatten|kokande vatten|ljummet vatten|salt|peppar|svartpeppar|vitpeppar|flingsalt|havssalt|salt (och|&) (svart)?peppar)$/i;

        const normalizeName = (name) => {
          let n = String(name || '').replace(/\s*\(.*?\)\s*/g, ' ').toLowerCase().trim();
          n = n.replace(/\s+/g, ' '); 
          if (!n) return '';
          
          if (n === 'gullök' || n === 'gula lökar' || n === 'gul lökar') return 'Gul lök';
          if (n === 'rödlök' || n === 'röda lökar' || n === 'röd lökar') return 'Röd lök';
          if (n === 'krossade tomater' || n === 'krossad tomat') return 'Krossade tomater';
          if (n === 'passerade tomater' || n === 'passerad tomat') return 'Passerade tomater';
          if (n === 'köttfärs' || n === 'nötfärs' || n === 'blandfärs') return 'Nötfärs/blandfärs';
          if (n === 'matlagningsgrädde' || n === 'vispgrädde') return 'Grädde';
          
          const exactSynonyms = { 'creme fraiche': 'Crème fraiche', 'crème fraîche': 'Crème fraiche', 'crème fraiche': 'Crème fraiche' };
          if (exactSynonyms[n]) return exactSynonyms[n];
          
          n = n.replace(/vitlöks\s*klyft(a|or)/g, 'vitlöksklyfta').replace(/kyckling(bröst)?\s*filé(er)?/g, 'kycklingfilé');
          const nounReps = { 'klyftor$':'klyfta', 'lökar$':'lök', 'tomater$':'tomat', 'morötter$':'morot', 'potatisar$':'potatis', 'filéer$':'filé', 'förpackningar$':'förp', 'burkar$':'burk', 'skivor$':'skiva', 'bitar$':'bit', 'påsar$':'påse', 'krukor$':'kruka', 'halvor$':'halva' };
          const beforeNouns = n;
          for (let [k, v] of Object.entries(nounReps)) n = n.replace(new RegExp(k, 'i'), v);
          // Adjektivet görs bara om till singular när substantivet också blev det ("röda lökar" → "röd lök", men "röda linser" förblir)
          if (n !== beforeNouns) {
            const adjReps = { '^gula ':'gul ', '^röda ':'röd ', '^gröna ':'grön ', '^färska ':'färsk ' };
            for (let [k, v] of Object.entries(adjReps)) n = n.replace(new RegExp(k, 'i'), v);
          }
          return n.charAt(0).toUpperCase() + n.slice(1);
        };

        const normalizeUnit = (unit) => {
          let u = String(unit || '').toLowerCase().trim();
          const matchers = {
            'st': /^(klyftor|klyfta|stycken|styck|st\.)$/, 'förp': /^(förpackning|paket|pkt|förpackningar)$/,
            'kruka': /^(krukor)$/, 'skiva': /^(skivor)$/, 'burk': /^(burkar|burk)$/, 'port': /^(portioner|portion)$/,
            'g': /^(gram)$/, 'kg': /^(kilo)$/, 'msk': /^(matskedar|matsked)$/, 'tsk': /^(teskedar|tesked)$/,
            'krm': /^(kryddmått)$/, 'l': /^(liter)$/, 'dl': /^(deciliter)$/, 'ml': /^(milliliter)$/
          };
          for (let [k, v] of Object.entries(matchers)) if (v.test(u)) return k;
          return u;
        };

        const formatAmounts = (amountsObj) => {
          const parts = [];
          for (const [unit, amount] of Object.entries(amountsObj)) {
            if (amount === 0) { if (unit) parts.push(unit); continue; }
            let displayAmount = amount, displayUnit = unit;
            if (unit === 'g' && amount >= 1000 && amount % 100 === 0) { displayAmount = amount / 1000; displayUnit = 'kg'; }
            parts.push(`${String(Math.round(displayAmount * 10) / 10).replace('.', ',')} ${displayUnit}`.trim());
          }
          return parts.join(' + ');
        };

        // Delar upp instruktioner i steg. Tidigare delades även "Sätt ugnen på 200. Lägg..." upp och siffran försvann.
        const parseInstructionsText = (text) => {
          if (!text) return [];
          if (isArray(text)) return text.map(s => String(s).trim()).filter(Boolean);
          const str = String(text);
          let lines = str.split(/\n+/).map(s => s.trim()).filter(Boolean);
          if (lines.length <= 1) {
            lines = str.replace(/(^|\s)\d{1,2}[.)]\s+(?=[A-Za-zÅÄÖåäöÉé])/g, '\n').split('\n').map(s => s.trim()).filter(Boolean);
          }
          return lines.map(s => s.replace(/^\d{1,2}[.)]\s*/, '').replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
        };

        const copyText = async (text) => {
          try {
            if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
          } catch (e) {}
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          let ok = false;
          try { ok = document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          return ok;
        };

        // ---- Bilder ----
        const FALLBACK_IMAGES = [
          "https://images.unsplash.com/photo-1495114752715-2c392c6c78a0?q=80&w=800&auto=format&fit=crop",
          "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?q=80&w=800&auto=format&fit=crop"
        ];

        const getFallbackImage = (id) => {
           if (!id) return FALLBACK_IMAGES[0];
           let hash = 0;
           for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
           return FALLBACK_IMAGES[Math.abs(hash) % FALLBACK_IMAGES.length];
        };

        const getRecipeImage = (recipe) => {
          if (recipe.customImage) return recipe.customImage;
          let seed = Math.abs([...(recipe.name || '')].reduce((s, c) => Math.imul(31, s) + c.charCodeAt(0) | 0, 0));
          let translated = (recipe.name || '').toLowerCase();
          const dict = { 'köttfärssås': 'bolognese sauce', 'köttbullar': 'meatballs', 'torsk': 'cod fish', 'lax': 'salmon' };
          Object.keys(dict).forEach(k => translated = translated.replace(new RegExp(k, 'gi'), dict[k]));
          let context = recipe.collection === "Soppor" ? "creamy soup in a bowl" : "delicious food plate";
          const finalPrompt = `Professional food photography of ${translated}, ${context}, appetizing, restaurant plating, absolutely no text`;
          return `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?width=800&height=600&nologo=true&seed=${seed}`;
        };

        const readFileAsDataURL = (file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('Kunde inte läsa filen'));
          reader.readAsDataURL(file);
        });
        const loadImage = (src) => new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Kunde inte läsa bilden'));
          img.src = src;
        });
        const resizeImageFile = async (file, maxDim, quality) => {
          const img = await loadImage(await readFileAsDataURL(file));
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const width = Math.round(img.width * scale), height = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          return canvas.toDataURL('image/jpeg', quality);
        };

        // =========================================================================
        // GEMINI (AI)
        // =========================================================================
        const isCanvasEnvironment = typeof __app_id !== 'undefined';
        const isApiKeyError = (err) => /API key|API_KEY|unregistered callers/i.test(err?.message || '');

        const fetchWithBackoff = async (url, options, maxRetries = 3) => {
          for (let i = 0; i < maxRetries; i++) {
            let response;
            try {
              response = await fetch(url, options);
            } catch (networkError) {
              if (i === maxRetries - 1) throw new Error('Ingen kontakt med AI-tjänsten. Kontrollera nätverket.');
              await new Promise(res => setTimeout(res, 1000 * 2 ** i));
              continue;
            }
            if (response.ok) return response.json();
            const errorData = await response.json().catch(() => null);
            const error = new Error(errorData?.error?.message || `HTTP-fel ${response.status}`);
            // Försök bara igen vid överbelastning/serverfel – inte vid fel nyckel eller felaktig begäran
            const retryable = response.status === 429 || response.status >= 500;
            if (!retryable || i === maxRetries - 1) throw error;
            await new Promise(res => setTimeout(res, 1000 * 2 ** i));
          }
        };

        const callGemini = async (promptText, base64Data, mimeType, responseSchema, temperature = 0.1) => {
          const customKey = (lsGet('apiKey') || '').trim();
          if (!customKey && !isCanvasEnvironment) throw new Error('API key saknas');
          const activeKey = customKey || apiKey;
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(activeKey)}`;
          
          const parts = [{ text: promptText }];
          if (base64Data) parts.push({ inlineData: { mimeType, data: base64Data } });
          
          const payload = { contents: [{ role: "user", parts }], generationConfig: { temperature, responseMimeType: "application/json", responseSchema } };
          const result = await fetchWithBackoff(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const text = (result?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
          if (!text) throw new Error('AI:n gav inget svar – försök igen.');
          return JSON.parse(text);
        };

        const recipeSchema = {
          type: "OBJECT",
          properties: {
            name: { type: "STRING" },
            protein: { type: "STRING", enum: PROTEINS },
            collection: { type: "STRING", enum: RECIPE_COLLECTIONS },
            time: { type: "STRING", description: "Total tid, t.ex. '30 min'" },
            instructions: { type: "STRING", description: "Numrerade steg, ett steg per rad" },
            ingredients: {
              type: "ARRAY",
              items: {
                type: "OBJECT",
                properties: {
                  name: { type: "STRING" },
                  amount: { type: "NUMBER", description: "Mängd som tal, 0 om ingen mängd anges" },
                  unit: { type: "STRING", description: "Enhet, t.ex. g, dl, st, msk. Tom sträng om enhet saknas" }
                },
                required: ["name", "amount", "unit"]
              }
            }
          },
          required: ["name", "protein", "collection", "time", "ingredients", "instructions"]
        };
        const RECIPE_RULES = `Skriv allt på svenska. protein ska vara exakt ett av: ${PROTEINS.join(', ')}. collection ska vara exakt en av: ${RECIPE_COLLECTIONS.join(', ')}. Skriv instruktionerna som numrerade steg, ett per rad.`;

        // =========================================================================
        // SMÅKOMPONENTER
        // =========================================================================
        const RobotLogo = () => <img src="./logo.png" alt="KockBot Logo" className="w-full h-full object-cover rounded-lg shadow-sm" />;

        const CatBadge = ({ protein }) => {
          const colors = { 
            'kött': 'bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-400 border-red-200 dark:border-red-800', 
            'fisk': 'bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-400 border-blue-200 dark:border-blue-800', 
            'veg': 'bg-[#bacca0] dark:bg-[#171f0d]/40 text-[#293819] dark:text-[#82a061] border-[#bacca0] dark:border-[#293819]', 
            'kyckling': 'bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800' 
          };
          const p = normalizeProtein(protein);
          return <span className={`px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm border ${colors[p]}`}>{p}</span>;
        };

        const SelectBox = ({ value, onChange, label, children }) => (
          <div className="relative flex-1 sm:flex-none">
            <select aria-label={label} value={value} onChange={onChange} className="w-full appearance-none bg-white dark:bg-slate-900 pl-4 pr-10 py-3.5 rounded-2xl border shadow-sm text-sm font-bold outline-none focus:ring-2 focus:ring-[#6a8a47] cursor-pointer">{children}</select>
            <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400"><ChevronDown size={16} strokeWidth={3} /></div>
          </div>
        );

        const ListRow = ({ name, checked, onToggle, compact, children }) => (
          <div className={`flex ${compact ? 'flex-row items-center' : 'flex-col sm:flex-row sm:items-center'} justify-between p-4 rounded-2xl border duration-300 gap-4 sm:gap-2 ${checked ? 'bg-slate-50/50 dark:bg-slate-900/30 border-transparent opacity-60 scale-[0.98]' : 'bg-white dark:bg-slate-800 shadow-sm hover:shadow-md'}`}>
            <div className="flex items-center gap-4 flex-1 min-w-0 cursor-pointer" onClick={onToggle}>
              <div className={`flex-shrink-0 w-7 h-7 rounded-full border-2 flex items-center justify-center ${checked ? 'bg-[#6a8a47] border-[#6a8a47]' : 'border-slate-300 bg-slate-50 dark:bg-slate-900'}`}>{checked && <Check size={16} className="text-white" strokeWidth={3} />}</div>
              <span className={`font-semibold text-lg sm:text-base break-words ${checked ? 'line-through text-slate-400' : ''}`}>{name}</span>
            </div>
            {children && <div className={`flex items-center gap-4 ${compact ? '' : 'justify-between sm:justify-end w-full sm:w-auto pl-11 sm:pl-0'}`}>{children}</div>}
          </div>
        );

        // =========================================================================
        // MODALER
        // OBS: Dessa ligger utanför App med flit. Tidigare låg de inuti App, vilket gjorde att React
        // byggde om dem från noll vid varje uppdatering (t.ex. när ett meddelande visades) –
        // då försvann det man skrivit i formuläret och kamerascanningen tappade sitt resultat.
        // =========================================================================

        const ShareModal = ({ open, onClose, householdId, onJoin, onCopy }) => {
          const [joinCode, setJoinCode] = useState('');
          const [isJoining, setIsJoining] = useState(false);
          if (!open) return null;
          const handleJoin = async () => {
            if (!joinCode.trim() || isJoining) return;
            setIsJoining(true);
            const ok = await onJoin(joinCode);
            setIsJoining(false);
            if (ok) { setJoinCode(''); onClose(); }
          };
          return (
            <div className="fixed inset-0 bg-slate-900/40 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50" onClick={onClose}>
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-200 border border-slate-100 dark:border-slate-700" onClick={e => e.stopPropagation()}>
                <div className="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center"><h2 className="text-xl font-bold dark:text-slate-100 flex items-center gap-2"><Users className="text-[#526e35] dark:text-[#82a061]" /> Familjedelning</h2><button onClick={onClose} className="text-slate-400 p-2" title="Stäng"><X size={20} /></button></div>
                <div className="p-6 space-y-6">
                  <div className="bg-[#f5f8f2] dark:bg-[#171f0d]/30 rounded-2xl p-5 text-center border border-[#e4ede0] dark:border-[#293819]">
                    <p className="text-sm font-semibold text-[#293819] dark:text-[#9eb582] mb-2">Din hushållskod</p>
                    <div className="text-3xl font-black text-[#526e35] dark:text-[#82a061] tracking-widest mb-3">{householdId}</div>
                    <button onClick={onCopy} className="px-4 py-2 bg-white dark:bg-slate-800 text-[#3d5226] dark:text-[#9eb582] rounded-lg text-sm font-bold shadow-sm border border-[#bacca0] dark:border-[#3d5226] flex items-center justify-center gap-2 mx-auto active:scale-95"><Copy size={16} /> Kopiera kod</button>
                  </div>
                  <div className="border-t border-slate-100 dark:border-slate-700 pt-6">
                    <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Har du fått en kod?</label>
                    <div className="flex gap-2">
                      <input type="text" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleJoin()} placeholder="T.ex. ABC123" className="flex-1 min-w-0 px-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl outline-none uppercase font-bold tracking-widest" maxLength={6} />
                      <button onClick={handleJoin} disabled={!joinCode.trim() || isJoining} className="px-6 py-3 bg-slate-900 dark:bg-slate-700 text-white rounded-xl font-bold disabled:opacity-50 flex items-center gap-2">{isJoining && <Loader2 size={16} className="animate-spin" />} Anslut</button>
                    </div>
                    <p className="text-xs text-slate-400 mt-2">Matsedel, recept och inköpslista byts då mot det hushållets.</p>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const ApiModal = ({ open, onClose, showToast }) => {
          const [keyInput, setKeyInput] = useState('');
          useEffect(() => { if (open) setKeyInput(lsGet('apiKey') || ''); }, [open]);
          if (!open) return null;
          const save = () => {
            const trimmed = keyInput.trim();
            lsSet('apiKey', trimmed);
            onClose();
            showToast(trimmed ? 'Nyckeln sparades i webbläsaren!' : 'Nyckeln togs bort.');
          };
          return (
            <div className="fixed inset-0 bg-slate-900/40 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-[55]" onClick={onClose}>
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-sm p-6 relative animate-in fade-in zoom-in-95 duration-200 border border-slate-100 dark:border-slate-700" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 p-2 active:scale-95" title="Stäng"><X size={20} /></button>
                <h2 className="text-xl font-bold dark:text-slate-100 mb-2 flex items-center gap-2"><Key className="text-[#526e35] dark:text-[#82a061]" size={20}/> API-nyckel</h2>
                <p className="text-sm text-slate-500 dark:text-slate-400 mb-2 leading-relaxed">
                  AI-funktionerna (PDF-import, kamerascanning och inspiration) behöver en egen, gratis <b>Google Gemini API-nyckel</b>. Nyckeln sparas bara i den här webbläsaren.
                </p>
                <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 text-sm font-bold text-[#526e35] dark:text-[#82a061] mb-4">Skaffa nyckel hos Google AI Studio <ExternalLink size={14} /></a>
                <input type="text" value={keyInput} onChange={e => setKeyInput(e.target.value)} placeholder="AIzaSy..." autoComplete="off" spellCheck={false} className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none dark:text-slate-100 mb-4 text-sm font-mono shadow-inner" />
                <button onClick={save} className="w-full px-4 py-3 bg-[#526e35] dark:bg-[#6a8a47] hover:bg-[#3d5226] text-white rounded-xl font-bold active:scale-95 shadow-md">Spara nyckel</button>
              </div>
            </div>
          );
        };

        const DayRecipePickerModal = ({ day, recipes, onSelect, onClose }) => {
          const [pickerSearch, setPickerSearch] = useState('');
          const rule = { protein: day.targetProteinMarker || '', collection: day.targetCollectionMarker || '' };
          const hasRule = !!(rule.protein || rule.collection);
          const q = pickerSearch.trim().toLowerCase();
          const availableRecipes = recipes
            .filter(r => !q || (r.name || '').toLowerCase().includes(q) || (r.ingredients || []).some(i => (i.name || '').toLowerCase().includes(q)))
            .sort((a, b) => (Number(matchesRule(b, rule)) - Number(matchesRule(a, rule))) || (a.name || '').localeCompare(b.name || '', 'sv'));

          return (
            <div className="fixed inset-0 bg-slate-900/40 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50" onClick={onClose}>
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-md my-8 flex flex-col border border-slate-200/60 dark:border-slate-700 max-h-[80vh] overflow-hidden animate-in fade-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                <div className="p-5 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-white dark:bg-slate-800">
                  <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">Välj rätt till {dayLabel(day)}</h2>
                  <button onClick={onClose} className="text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 p-2 rounded-full active:scale-95" title="Stäng"><X size={20} /></button>
                </div>
                <div className="p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
                  <div className="relative">
                    <Search className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                    <input type="text" placeholder="Sök recept eller ingrediens..." value={pickerSearch} onChange={e => setPickerSearch(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none text-slate-900 dark:text-slate-100 shadow-sm focus:ring-2 focus:ring-[#6a8a47]" />
                  </div>
                </div>
                <div className="overflow-y-auto flex-1 p-2 bg-slate-50 dark:bg-slate-900/20">
                  {availableRecipes.length === 0 ? (
                    <div className="text-center py-10 text-slate-500 dark:text-slate-400 font-medium">Inga recept hittades.</div>
                  ) : (
                    <div className="space-y-1.5 p-2">
                      {availableRecipes.map(r => (
                        <button key={r.id} onClick={() => onSelect(r)} className="w-full text-left p-4 flex items-center justify-between gap-3 bg-white dark:bg-slate-800 hover:bg-[#f5f8f2] dark:hover:bg-slate-700 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors active:scale-95 group">
                          <span className="min-w-0">
                            <span className="block font-bold text-slate-800 dark:text-slate-100 group-hover:text-[#526e35] dark:group-hover:text-[#82a061] transition-colors truncate">{r.name}</span>
                            {hasRule && matchesRule(r, rule) && <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#6a8a47]">Passar dagen</span>}
                          </span>
                          <CatBadge protein={r.protein} />
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        const toFormIngredient = (ing) => ({
          _k: Math.random().toString(36).slice(2),
          name: ing?.name || '',
          amount: ing?.amount === undefined || ing?.amount === null ? '' : String(ing.amount).replace('.', ','),
          unit: ing?.unit || '',
        });
        const emptyIngredient = () => toFormIngredient({ name: '', amount: 1, unit: 'st' });

        const AddRecipeModal = ({ recipeToEdit, onClose, onSave, showToast, onApiKeyError }) => {
          const isEditing = !!recipeToEdit;
          const [formData, setFormData] = useState(() => {
            if (recipeToEdit) {
              const { customImage, ...rest } = recipeToEdit;
              return {
                ...rest,
                name: rest.name || '',
                protein: normalizeProtein(rest.protein),
                collection: RECIPE_COLLECTIONS.includes(rest.collection) ? rest.collection : 'Övriga vardagsrätter',
                time: rest.time || '',
                instructions: isArray(rest.instructions) ? rest.instructions.join('\n') : (rest.instructions || ''),
                ingredients: (rest.ingredients || []).map(toFormIngredient),
              };
            }
            return { name: '', protein: 'kött', collection: 'Spaghetti- & pastarätter', time: '30 min', ingredients: [emptyIngredient()], instructions: '' };
          });
          const [isScanning, setIsScanning] = useState(false);
          const cameraInputRef = useRef(null);

          const updateField = (field, value) => setFormData(prev => ({ ...prev, [field]: value }));
          const updateIngredient = (idx, field, value) => setFormData(prev => ({ ...prev, ingredients: prev.ingredients.map((ing, i) => i === idx ? { ...ing, [field]: value } : ing) }));
          const addIngredient = () => setFormData(prev => ({ ...prev, ingredients: [...prev.ingredients, emptyIngredient()] }));
          const removeIngredient = (idx) => setFormData(prev => ({ ...prev, ingredients: prev.ingredients.filter((_, i) => i !== idx) }));

          const handleSave = () => {
            if (!formData.name.trim()) return showToast('Receptet måste ha ett namn.');
            onSave({
              ...formData,
              name: formData.name.trim(),
              time: (formData.time || '').trim(),
              ingredients: formData.ingredients
                .filter(i => (i.name || '').trim())
                .map(i => ({ name: i.name.trim(), amount: parseAmount(i.amount), unit: (i.unit || '').trim() })),
            });
          };

          const handleScanRecipe = async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            setIsScanning(true);
            showToast('Tittar på bilden...');
            try {
              const dataUrl = await resizeImageFile(file, 1200, 0.8);
              const prompt = `Extrahera receptet från denna bild. Fyll i alla fält noggrant (namn, protein, tid, ingredienser med mängd och enhet, samt steg-för-steg-instruktioner). Om något saknas, gör en rimlig gissning utifrån rätten. ${RECIPE_RULES}`;
              const data = await callGemini(prompt, dataUrl.split(',')[1], 'image/jpeg', recipeSchema);
              if (!data || !data.name) throw new Error('Tomt svar från AI:n');
              const r = normalizeRecipe(data, 'scan');
              setFormData(prev => ({
                ...prev,
                name: r.name || prev.name,
                protein: r.protein,
                collection: r.collection,
                time: r.time || prev.time,
                ingredients: r.ingredients.length ? r.ingredients.map(toFormIngredient) : prev.ingredients,
                instructions: r.instructions || prev.instructions,
              }));
              showToast('Ifyllt från bilden – kolla gärna igenom innan du sparar!');
            } catch (err) {
              if (isApiKeyError(err)) { console.warn('Kameraskanning:', err.message); onApiKeyError(); showToast('Gemini-nyckeln saknas eller är ogiltig. Lägg in den här.'); }
              else { console.error('Kameraskanning:', err); showToast('Kunde inte tolka bilden: ' + shortError(err)); }
            } finally {
              setIsScanning(false);
              if (cameraInputRef.current) cameraInputRef.current.value = '';
            }
          };

          return (
            <div className="fixed inset-0 bg-slate-900/40 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50 overflow-y-auto" onClick={onClose}>
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-2xl my-8 flex flex-col border border-slate-200/60 dark:border-slate-700" style={{ maxHeight: 'calc(100vh - 4rem)' }} onClick={e => e.stopPropagation()}>
                <div className="p-6 border-b flex justify-between items-center rounded-t-3xl"><h2 className="text-xl font-bold dark:text-slate-100">{isEditing ? 'Redigera recept' : 'Skapa recept'}</h2><button onClick={onClose} className="text-slate-400" title="Stäng"><X size={20} /></button></div>
                <div className="p-6 space-y-6 overflow-y-auto flex-1 bg-slate-50/50 dark:bg-slate-900/50">
                  <div className="bg-[#f5f8f2] dark:bg-[#171f0d]/30 border border-[#e4ede0] dark:border-[#293819] rounded-2xl p-4 flex flex-col sm:flex-row gap-4 items-center justify-between shadow-sm">
                    <div><h3 className="font-bold text-[#293819] dark:text-[#9eb582]">Recept framför dig?</h3><p className="text-[#526e35] dark:text-[#82a061] text-sm">Fota av eller välj en bild, så fyller vi i automatiskt!</p></div>
                    <div className="relative w-full sm:w-auto">
                      <input type="file" accept="image/*" ref={cameraInputRef} onChange={handleScanRecipe} className="hidden" id="camera-upload" disabled={isScanning} />
                      <label htmlFor="camera-upload" className={`flex items-center justify-center gap-2 px-5 py-2.5 ${isScanning ? 'bg-[#bacca0] text-[#526e35]' : 'bg-[#526e35] text-white cursor-pointer'} rounded-xl font-semibold text-sm w-full`}>{isScanning ? <Loader2 size={16} className="animate-spin" /> : <Camera size={16} />} {isScanning ? 'Läser bild...' : 'Scanna recept'}</label>
                    </div>
                  </div>
                  <div><label className="block text-sm font-semibold dark:text-slate-300 mb-1.5">Receptnamn</label><input type="text" value={formData.name} onChange={e => updateField('name', e.target.value)} className="w-full px-4 py-3 bg-white dark:bg-slate-800 border rounded-xl outline-none shadow-sm dark:text-slate-100" /></div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label className="block text-sm font-semibold dark:text-slate-300 mb-1.5">Protein</label><select value={formData.protein} onChange={e => updateField('protein', e.target.value)} className="w-full px-4 py-3 bg-white dark:bg-slate-800 border rounded-xl outline-none dark:text-slate-100"><option value="kött">Kött</option><option value="fisk">Fisk</option><option value="veg">Vegetariskt</option><option value="kyckling">Kyckling</option></select></div>
                    <div><label className="block text-sm font-semibold dark:text-slate-300 mb-1.5">Kategori</label><select value={formData.collection} onChange={e => updateField('collection', e.target.value)} className="w-full px-4 py-3 bg-white dark:bg-slate-800 border rounded-xl outline-none dark:text-slate-100">{RECIPE_COLLECTIONS.map(c => <option key={c}>{c}</option>)}</select></div>
                    <div><label className="block text-sm font-semibold dark:text-slate-300 mb-1.5">Tid</label><input type="text" value={formData.time} onChange={e => updateField('time', e.target.value)} className="w-full px-4 py-3 bg-white dark:bg-slate-800 border rounded-xl outline-none dark:text-slate-100" /></div>
                  </div>
                  <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm">
                    <div className="flex justify-between items-center mb-4"><label className="text-sm font-semibold dark:text-slate-300">Ingredienser</label><button onClick={addIngredient} className="text-sm font-semibold text-[#526e35] dark:text-[#82a061] bg-[#f5f8f2] dark:bg-[#171f0d]/30 px-3 py-1.5 rounded-lg flex items-center gap-1.5"><Plus size={16} /> Lägg till</button></div>
                    <div className="space-y-3">{formData.ingredients.map((ing, idx) => (
                        <div key={ing._k} className="flex gap-2 items-center">
                          <input type="text" value={ing.name} onChange={e => updateIngredient(idx, 'name', e.target.value)} placeholder="Morot" className="flex-1 min-w-0 px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-lg text-sm dark:text-slate-100" />
                          <input type="text" inputMode="decimal" value={ing.amount} onChange={e => updateIngredient(idx, 'amount', e.target.value)} placeholder="1,5" aria-label="Mängd" className="w-16 sm:w-20 px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-lg text-sm dark:text-slate-100" />
                          <input type="text" value={ing.unit} onChange={e => updateIngredient(idx, 'unit', e.target.value)} placeholder="st" aria-label="Enhet" className="w-14 sm:w-16 px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-lg text-sm dark:text-slate-100" />
                          <button onClick={() => removeIngredient(idx)} className="p-2 text-red-400" title="Ta bort ingrediens"><Trash2 size={18} /></button>
                        </div>
                    ))}</div>
                  </div>
                  <div><label className="block text-sm font-semibold dark:text-slate-300 mb-1.5">Gör så här</label><textarea value={formData.instructions} onChange={e => updateField('instructions', e.target.value)} placeholder={'1. Koka pastan.\n2. Stek löken.'} className="w-full px-4 py-3 bg-white dark:bg-slate-800 border rounded-xl outline-none min-h-[120px] dark:text-slate-100" /></div>
                </div>
                <div className="p-6 border-t flex justify-end gap-3 rounded-b-3xl">
                  <button onClick={onClose} className="px-6 py-2.5 text-slate-600 dark:text-slate-300 font-semibold">Avbryt</button>
                  <button onClick={handleSave} disabled={!formData.name.trim() || isScanning} className="px-6 py-2.5 bg-[#526e35] text-white rounded-xl font-semibold flex items-center gap-2 disabled:opacity-50"><Save size={18} /> Spara</button>
                </div>
              </div>
            </div>
          );
        };

        const RecipeModal = ({ recipe, isInBook, onClose, onDelete, onEdit, onUploadImage, addTargetLabel, onAddToDay, pickOtherLabel, onPickOther }) => {
          const [imgLoading, setImgLoading] = useState(true);
          if (!recipe) return null;
          const steps = parseInstructionsText(recipe.instructions);
          const ingredients = recipe.ingredients || [];

          return (
            <div className="fixed inset-0 bg-slate-900/40 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50 overflow-y-auto" onClick={onClose}>
              <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-lg my-8 flex flex-col border border-slate-200/60 dark:border-slate-700 relative overflow-hidden" style={{ maxHeight: 'calc(100vh - 4rem)' }} onClick={e => e.stopPropagation()}>
                
                <div className="p-4 border-b border-slate-100/50 dark:border-slate-700/50 flex justify-between items-center bg-white/90 dark:bg-slate-800/90 backdrop-blur-md absolute top-0 left-0 right-0 z-20">
                  {isInBook ? (
                    <button onClick={() => onDelete(recipe)} className="text-red-500 bg-red-50 dark:bg-slate-700 hover:bg-red-100 dark:hover:bg-slate-600 rounded-full p-2.5 shadow-sm border border-red-100 dark:border-slate-600 transition-colors flex items-center gap-1.5 px-3" title="Ta bort recept">
                      <Trash2 size={18} /> <span className="text-xs font-bold hidden sm:inline">Radera</span>
                    </button>
                  ) : (
                    <span className="text-xs font-bold text-slate-400 px-2">Finns inte längre i receptboken</span>
                  )}
                  <div className="flex gap-2">
                    {isInBook && (
                      <button onClick={() => onEdit(recipe)} className="text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 rounded-full p-2.5 shadow-sm border transition-colors" title="Redigera recept"><Edit size={20} /></button>
                    )}
                    <button onClick={onClose} className="text-slate-400 bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 rounded-full p-2.5 shadow-sm border transition-colors" title="Stäng"><X size={20} /></button>
                  </div>
                </div>
                
                <div className="p-6 pt-24 overflow-y-auto flex-1 flex flex-col">
                  <div className="mb-6 relative">
                    {isInBook && <button onClick={() => onUploadImage(recipe.id)} className="absolute top-0 right-0 p-2.5 bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm text-slate-500 hover:text-[#526e35] dark:hover:text-[#82a061] rounded-full shadow-sm border z-30" title="Lägg till egen bild"><ImagePlus size={20} /></button>}
                    <span className="text-xs font-bold text-[#526e35] dark:text-[#82a061] uppercase tracking-widest mb-2 block">{recipe.collection}</span>
                    <h2 className="text-3xl font-extrabold dark:text-slate-100 leading-tight mb-4 pr-12">{recipe.name}</h2>
                    <div className="w-full h-48 sm:h-64 bg-slate-100 dark:bg-slate-700 rounded-2xl mb-5 overflow-hidden shadow-inner border relative">
                      {imgLoading && <div className="absolute inset-0 flex items-center justify-center z-10"><Loader2 size={24} className="text-slate-400 animate-spin" /></div>}
                      <img src={getRecipeImage(recipe)} alt={recipe.name} className={`w-full h-full object-cover transition-opacity duration-700 ${imgLoading ? 'opacity-0' : 'opacity-100'}`} onLoad={() => setImgLoading(false)} onError={(e) => { e.target.onerror = null; e.target.src = getFallbackImage(recipe.id); setImgLoading(false); }} />
                    </div>
                    <div className="flex items-center gap-3 text-sm font-medium text-slate-500 dark:text-slate-400"><CatBadge protein={recipe.protein} />{recipe.time && <span className="flex items-center gap-1.5 bg-white dark:bg-slate-700 shadow-sm border px-3 py-1 rounded-full"><Clock size={16}/> {recipe.time}</span>}</div>
                  </div>
                  <div className="space-y-6 pb-6">
                    <div className="bg-[#f5f8f2] dark:bg-[#171f0d]/20 p-5 rounded-2xl border border-[#e4ede0] dark:border-[#293819] shadow-sm">
                      <h3 className="font-bold dark:text-slate-100 mb-3 flex items-center gap-2"><ShoppingCart size={18} className="text-[#526e35] dark:text-[#82a061]"/> Ingredienser</h3>
                      {ingredients.length === 0 ? <p className="text-sm text-slate-500">Inga ingredienser angivna.</p> : (
                        <ul className="space-y-2.5">{ingredients.map((ing, i) => (
                            <li key={i} className="flex justify-between items-center gap-3 text-sm"><span className="font-medium dark:text-slate-300">{ing.name}</span>{(ing.amount || ing.unit) ? <span className="text-[#3d5226] dark:text-[#9eb582] font-bold bg-white dark:bg-slate-800 px-2 py-1 rounded-md shadow-sm border whitespace-nowrap">{ing.amount ? String(ing.amount).replace('.', ',') : ''} {ing.unit}</span> : null}</li>
                        ))}</ul>
                      )}
                    </div>
                    <div>
                      <h3 className="font-bold dark:text-slate-100 mb-3 flex items-center gap-2"><Utensils size={18} className="text-[#526e35] dark:text-[#82a061]"/> Tillagning</h3>
                      {steps.length === 0 ? <p className="text-sm text-slate-500">Inga instruktioner angivna.</p> : (
                        <div className="space-y-3">
                          {steps.map((step, idx) => (
                              <div key={idx} className="flex gap-4 p-4 bg-white dark:bg-slate-700 rounded-2xl border shadow-sm">
                                <span className="flex-shrink-0 w-8 h-8 flex items-center justify-center bg-[#f5f8f2] dark:bg-[#171f0d]/50 rounded-full text-[#526e35] dark:text-[#82a061] font-bold border border-[#e4ede0] dark:border-[#293819]">{idx + 1}</span>
                                <p className="text-slate-700 dark:text-slate-200 pt-1 leading-relaxed">{step}</p>
                              </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  
                  {(onPickOther || onAddToDay) && (
                    <div className="mt-auto pt-6 border-t border-slate-100 dark:border-slate-700">
                      {onPickOther ? (
                        <button onClick={onPickOther} className="w-full px-6 py-4 bg-white dark:bg-slate-700 border-2 border-[#526e35] text-[#526e35] dark:text-[#9eb582] rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all shadow-sm">
                          <Search size={20} /> Välj en annan rätt för {pickOtherLabel}
                        </button>
                      ) : (
                        <button onClick={onAddToDay} className="w-full px-6 py-4 bg-[#526e35] hover:bg-[#3d5226] text-white rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all shadow-md">
                          <CalendarPlus size={20} /> Lägg till på {addTargetLabel}
                        </button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        // =========================================================================
        // HUVUDKOMPONENT
        // =========================================================================
        const App = () => {
          const [activeTab, setActiveTab] = useState('plan'); 
          const [planType, setPlanType] = useState(() => { const v = lsGet('planType'); return WEEKS_BY_PLAN_TYPE[v] ? v : 'week'; });
          const [toastMessage, setToastMessage] = useState(null);
          const [user, setUser] = useState(null);

          const [isDarkMode, setIsDarkMode] = useState(() => {
            const saved = lsGet('theme');
            return saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          });

          const [householdId, setHouseholdId] = useState(() => lsGet('householdId') || generateHouseholdId());
          const [showShareModal, setShowShareModal] = useState(false);
          const [showApiModal, setShowApiModal] = useState(false);
          const [isPlanLocked, setIsPlanLocked] = useState(() => lsGet('planLocked') === 'true');
          const [planStartOffset, setPlanStartOffset] = useState(() => Number(lsGet('planStartOffset')) || 0);

          const [inspirationQuery, setInspirationQuery] = useState('');
          const [isGeneratingInspiration, setIsGeneratingInspiration] = useState(false);
          const [inspiredRecipe, setInspiredRecipe] = useState(null);

          // Säker initialisering – trasig data i minnet ska inte ge vit skärm
          const [recipes, setRecipes] = useState(() => lsGetJSON('recipes', [], isArray));
          const [mealPlan, setMealPlan] = useState(() => lsGetJSON('mealPlan', [], isArray));
          const [checkedListItems, setCheckedListItems] = useState(() => lsGetJSON('checkedListItems', {}, isObject));
          const [lockedWeeks, setLockedWeeks] = useState(() => lsGetJSON('lockedWeeks', {}, isObject));
          const [extraItems, setExtraItems] = useState(() => lsGetJSON('extraItems', [], isArray));
          const [extraInput, setExtraInput] = useState('');
          const [listScope, setListScope] = useState(() => lsGet('listScope') === 'all' ? 'all' : 'upcoming');

          const [recipeSearchQuery, setRecipeSearchQuery] = useState('');
          const [pickerDayIndex, setPickerDayIndex] = useState(null);
          const [selectedCollection, setSelectedCollection] = useState('Alla');
          const [openRecipe, setOpenRecipe] = useState(null); // { id, fallback, planIndex }
          
          const [showAddModal, setShowAddModal] = useState(false);
          const [editingRecipeId, setEditingRecipeId] = useState(null);
          const [isUploadingPdf, setIsUploadingPdf] = useState(false);
          
          const fileInputRef = useRef(null);
          const imageUploadRef = useRef(null);
          const uploadingRecipeIdRef = useRef(null);
          const toastTimerRef = useRef(null);

          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [isIOS, setIsIOS] = useState(false);
          const [isStandalone, setIsStandalone] = useState(false);

          const today = todayISO();

          // Alltid aktuell data för async-funktioner och databas-callbacks (undviker gammal data i closures)
          const recipesRef = useRef(recipes);
          recipesRef.current = recipes;
          const stateRef = useRef({});
          stateRef.current = { recipes, mealPlan, planType, checkedListItems, isPlanLocked, planStartOffset, lockedWeeks, extraItems };

          const showToast = useCallback((msg) => {
            setToastMessage(msg);
            clearTimeout(toastTimerRef.current);
            toastTimerRef.current = setTimeout(() => setToastMessage(null), 4000);
          }, []);

          // PWA Manifest och Dark Mode
          useEffect(() => {
            let manifest = document.querySelector('link[rel="manifest"]');
            if (!manifest) {
              manifest = document.createElement('link');
              manifest.rel = 'manifest';
              document.head.appendChild(manifest);
            }
            const manifestData = {
              name: "KockBot", short_name: "KockBot", start_url: ".", display: "standalone",
              background_color: isDarkMode ? "#0f172a" : "#f8fafc", theme_color: isDarkMode ? "#171f0d" : "#bacca0",
              icons: [ { src: "./logo.png", sizes: "192x192", type: "image/png", purpose: "any maskable" }, { src: "./logo.png", sizes: "512x512", type: "image/png", purpose: "any maskable" } ]
            };
            manifest.href = `data:application/manifest+json;charset=utf-8,${encodeURIComponent(JSON.stringify(manifestData))}`;
            
            lsSet('theme', isDarkMode ? 'dark' : 'light');
            if (isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
          }, [isDarkMode]);

          // Auth
          useEffect(() => {
            if (!auth) return;
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  try { await signInWithCustomToken(auth, __initial_auth_token); } catch (e) { await signInAnonymously(auth); }
                } else { await signInAnonymously(auth); }
              } catch (e) { console.error('Inloggning misslyckades:', e); }
            };
            initAuth();
            return onAuthStateChanged(auth, setUser);
          }, []);

          // ---------------- Databas ----------------
          const saveRecipeToDb = async (recipe, { silent = false } = {}) => {
            if (!user || !db || !householdId) return false;
            try {
              await setDoc(doc(db, ...householdDocPath(householdId), 'recipes', recipe.id), toFirestore(recipe));
              return true;
            } catch (err) {
              console.error("Fel vid sparande av recept:", err);
              if (!silent) showToast(recipe.customImage ? 'Kunde inte spara i molnet – bilden är troligen för stor. Sparat på enheten.' : 'Kunde inte spara receptet i molnet. Sparat på enheten.');
              return false;
            }
          };

          // mergeFields ersätter hela fältet. (Med merge:true blandades gamla och nya värden ihop,
          // t.ex. kunde bockar i inköpslistan komma tillbaka efter att man slumpat ny matsedel.)
          const updateSettingsInDb = async (updates) => {
            if (!user || !db || !householdId) return;
            try {
              await setDoc(doc(db, ...householdDocPath(householdId)), toFirestore(updates), { mergeFields: Object.keys(updates) });
            } catch (err) {
              console.error('Kunde inte spara till molnet:', err);
              showToast('Kunde inte synka till molnet – ändringen finns bara på den här enheten.');
            }
          };

          const deleteRecipeFromDb = async (recipeId) => {
            if (!user || !db || !householdId) return;
            try { await deleteDoc(doc(db, ...householdDocPath(householdId), 'recipes', recipeId)); } catch (err) { console.error('Kunde inte radera i molnet:', err); }
          };

          // Databas-synk
          useEffect(() => {
            if (!user || !db || !householdId) return;
            
            const docRef = doc(db, ...householdDocPath(householdId));
            const unsubSettings = onSnapshot(docRef, (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                // Migrering: äldre versioner sparade recepten direkt i hushållsdokumentet
                if (isArray(data.recipes) && data.recipes.length > 0) {
                  data.recipes.forEach(recipe => {
                    if (recipe?.id) setDoc(doc(db, ...householdDocPath(householdId), 'recipes', recipe.id), toFirestore(recipe)).catch(() => {});
                  });
                  setDoc(docRef, { recipes: [] }, { merge: true }).catch(() => {});
                }
                if (isArray(data.mealPlan)) setMealPlan(data.mealPlan);
                if (WEEKS_BY_PLAN_TYPE[data.planType]) setPlanType(data.planType);
                if (isObject(data.checkedListItems)) setCheckedListItems(data.checkedListItems);
                if (data.isPlanLocked !== undefined) setIsPlanLocked(!!data.isPlanLocked);
                if (data.planStartOffset !== undefined) setPlanStartOffset(Number(data.planStartOffset) || 0);
                if (isObject(data.lockedWeeks)) setLockedWeeks(data.lockedWeeks);
                if (isArray(data.extraItems)) setExtraItems(data.extraItems);
              } else {
                // Nytt hushåll – ladda upp det som finns lokalt
                const s = stateRef.current;
                setDoc(docRef, toFirestore({ mealPlan: s.mealPlan, planType: s.planType, checkedListItems: s.checkedListItems, isPlanLocked: s.isPlanLocked, planStartOffset: s.planStartOffset, lockedWeeks: s.lockedWeeks, extraItems: s.extraItems }), { merge: true }).catch(console.error);
                s.recipes.forEach(r => saveRecipeToDb(r, { silent: true }));
              }
            }, (err) => console.error('Synkfel (hushåll):', err));

            const recipesCol = collection(db, ...householdDocPath(householdId), 'recipes');
            const unsubRecipes = onSnapshot(recipesCol, (snapshot) => {
              const loadedRecipes = [];
              snapshot.forEach((d) => { loadedRecipes.push({ ...d.data(), id: d.id }); });
              if (loadedRecipes.length > 0 || !snapshot.metadata.fromCache) setRecipes(loadedRecipes);
            }, (err) => { console.error("Recept-synkfel:", err); });

            return () => { unsubSettings(); unsubRecipes(); };
          }, [user, householdId]);

          // Spara lokalt
          useEffect(() => { lsSet('householdId', householdId); }, [householdId]);
          useEffect(() => { lsSet('recipes', JSON.stringify(recipes)); }, [recipes]);
          useEffect(() => { lsSet('mealPlan', JSON.stringify(mealPlan)); }, [mealPlan]);
          useEffect(() => { lsSet('planType', planType); }, [planType]);
          useEffect(() => { lsSet('checkedListItems', JSON.stringify(checkedListItems)); }, [checkedListItems]);
          useEffect(() => { lsSet('planLocked', String(isPlanLocked)); }, [isPlanLocked]);
          useEffect(() => { lsSet('planStartOffset', String(planStartOffset)); }, [planStartOffset]);
          useEffect(() => { lsSet('lockedWeeks', JSON.stringify(lockedWeeks)); }, [lockedWeeks]);
          useEffect(() => { lsSet('extraItems', JSON.stringify(extraItems)); }, [extraItems]);
          useEffect(() => { lsSet('listScope', listScope); }, [listScope]);

          // PWA-installation
          useEffect(() => {
            setIsIOS(/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream);
            setIsStandalone(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
            const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const installApp = async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') setDeferredPrompt(null);
            } else {
              showToast(isIOS ? "På iPhone: Tryck på 'Dela'-ikonen och välj 'Lägg till på hemskärmen'." : "På Android: Öppna webbläsarens meny och välj 'Lägg till på startskärmen'.");
            }
          };

          // ---------------- Härledd data ----------------
          const recipesById = useMemo(() => { const map = {}; recipes.forEach(r => { map[r.id] = r; }); return map; }, [recipes]);
          // Matsedeln sparar en kopia av receptet; använd alltid den senaste versionen ur receptboken om den finns
          const resolveRecipe = useCallback((r) => (r ? (recipesById[r.id] || r) : null), [recipesById]);
          const isDayLocked = (day) => isPlanLocked || !!(day?.weekKey && lockedWeeks[day.weekKey]);

          const planWeeks = useMemo(() => {
            const groups = [];
            mealPlan.forEach((day, index) => {
              const key = day.weekKey || `old-${Math.floor(index / 7)}`;
              let group = groups[groups.length - 1];
              if (!group || group.key !== key) {
                group = { key, lockKey: day.weekKey || null, weekNumber: day.weekNumber, days: [] };
                groups.push(group);
              }
              group.days.push({ day, index });
            });
            return groups;
          }, [mealPlan]);

          const shoppingDays = useMemo(
            () => mealPlan.filter(d => d?.recipe && (listScope === 'all' || !d.date || d.date >= today)),
            [mealPlan, listScope, today]
          );

          const shoppingList = useMemo(() => {
            const listMap = {};
            shoppingDays.forEach(day => {
              const recipe = resolveRecipe(day.recipe);
              (recipe?.ingredients || []).forEach(ing => {
                if (!ing?.name) return;
                const normName = normalizeName(ing.name);
                if (!normName || SKIP_INGREDIENTS.test(normName)) return;
                const normUnit = normalizeUnit(ing.unit);
                const amt = parseAmount(ing.amount);
                if (!listMap[normName]) listMap[normName] = { name: normName, amounts: {}, category: getCategory(normName) };
                listMap[normName].amounts[normUnit] = (listMap[normName].amounts[normUnit] || 0) + amt;
              });
            });
            const grouped = Object.fromEntries(SHOPPING_CATEGORIES.map(c => [c, []]));
            Object.values(listMap)
              .sort((a, b) => a.name.localeCompare(b.name, 'sv'))
              .forEach(item => (grouped[item.category] || grouped['Övrigt']).push(item));
            return Object.entries(grouped).filter(([, items]) => items.length > 0);
          }, [shoppingDays, resolveRecipe]);

          const filteredRecipes = useMemo(() => {
            let result = selectedCollection === 'Alla' ? recipes : recipes.filter(r => r.collection === selectedCollection);
            const query = recipeSearchQuery.trim().toLowerCase();
            if (query) {
              result = result.filter(r => 
                (r.name || '').toLowerCase().includes(query) || 
                (r.ingredients || []).some(i => (i.name || '').toLowerCase().includes(query))
              );
            }
            return [...result].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'sv'));
          }, [recipes, selectedCollection, recipeSearchQuery]);

          // ---------------- Matsedel ----------------
          const updatePlan = (newPlan) => { setMealPlan(newPlan); updateSettingsInDb({ mealPlan: newPlan }); };
          const updateDay = (index, changes) => updatePlan(mealPlan.map((m, i) => i === index ? { ...m, ...changes } : m));
          const setDayRecipe = (index, recipe) => updateDay(index, { recipe: stripImage(recipe) });

          const generatePlan = (type) => {
            if (recipes.length === 0) { showToast("Lägg till minst ett recept först."); setActiveTab('recipes'); return; }
            
            const numWeeks = WEEKS_BY_PLAN_TYPE[type] || 1;
            const firstMonday = addDays(getMonday(new Date()), planStartOffset * 7);
            const weeks = Array.from({ length: numWeeks }, (_, w) => {
              const monday = addDays(firstMonday, w * 7);
              const key = weekKeyOf(monday);
              return { monday, key, week: getISOWeekInfo(monday).week, locked: !!lockedWeeks[key] };
            });

            // Låsta veckor behålls. Deras rätter räknas som använda så att de inte upprepas.
            const keptDays = {};
            const usage = {};
            weeks.filter(w => w.locked).forEach(w => {
              mealPlan.forEach(m => {
                if (m.weekKey !== w.key) return;
                keptDays[`${w.key}|${m.dayName}`] = m;
                if (m.recipe) usage[m.recipe.id] = (usage[m.recipe.id] || 0) + 1;
              });
            });
            // Rätter från förra matsedeln väljs i sista hand, så att det blir omväxling
            mealPlan.forEach(m => { if (m.recipe && !usage[m.recipe.id]) usage[m.recipe.id] = 0.5; });

            const newPlan = [];
            weeks.forEach((w, wi) => {
              const weekdayProteins = shuffleArray(['fisk', 'veg', Math.random() > 0.5 ? 'kött' : 'kyckling', Math.random() > 0.5 ? 'kött' : 'kyckling']);
              DAYS.forEach((dayName, d) => {
                const base = { dayIndex: wi * 7 + d, dayName, date: toISODate(addDays(w.monday, d)), weekNumber: w.week, weekKey: w.key };
                const kept = keptDays[`${w.key}|${dayName}`];
                if (kept) { newPlan.push({ ...kept, ...base }); return; }
                const rule = dayRuleFor(d, weekdayProteins);
                const recipe = pickRecipe(recipes, { ...rule, avoidCollection: d < 4 ? 'Helgmat' : '' }, usage);
                if (recipe) usage[recipe.id] = Math.floor(usage[recipe.id] || 0) + 1;
                newPlan.push({ ...base, targetProteinMarker: rule.protein, targetCollectionMarker: rule.collection, recipe: stripImage(recipe) });
              });
            });

            // Bockar på "egna varor" behålls, bockar på maträtternas ingredienser nollställs
            const keptChecks = {};
            extraItems.forEach(i => { if (checkedListItems[`extra:${i.id}`]) keptChecks[`extra:${i.id}`] = true; });

            setMealPlan(newPlan); setPlanType(type); setCheckedListItems(keptChecks); setIsPlanLocked(false);
            updateSettingsInDb({ mealPlan: newPlan, planType: type, checkedListItems: keptChecks, isPlanLocked: false });
          };

          const toggleWeekLock = (weekKey, weekNumber) => {
            const next = { ...lockedWeeks };
            if (next[weekKey]) delete next[weekKey]; else next[weekKey] = true;
            setLockedWeeks(next);
            updateSettingsInDb({ lockedWeeks: next });
            showToast(next[weekKey] ? `Vecka ${weekNumber} är nu låst! 🔒` : `Vecka ${weekNumber} är upplåst! 🔓`);
          };

          const toggleLock = () => {
            const newLockState = !isPlanLocked;
            setIsPlanLocked(newLockState); 
            updateSettingsInDb({ isPlanLocked: newLockState });
            showToast(newLockState ? "Matsedeln är nu låst för hela hushållet! 🔒" : "Matsedeln är nu upplåst! 🔓");
          };

          const swapDayRecipe = (index) => {
            if (recipes.length === 0) return;
            const day = mealPlan[index];
            const rule = ruleForDay(day);
            const usage = {};
            mealPlan.forEach((m, i) => { if (i !== index && m.recipe) usage[m.recipe.id] = (usage[m.recipe.id] || 0) + 1; });
            const recipe = pickRecipe(recipes, rule, usage, day.recipe?.id);
            updateDay(index, { recipe: stripImage(recipe), targetProteinMarker: rule.protein, targetCollectionMarker: rule.collection });
          };

          const clearDayRecipe = (index) => updateDay(index, { recipe: null });

          // ---------------- Recept ----------------
          const deleteRecipe = (recipe) => {
            if (!window.confirm(`Ta bort "${recipe.name}" från receptboken?`)) return;
            setRecipes(prev => prev.filter(r => r.id !== recipe.id)); 
            deleteRecipeFromDb(recipe.id); 
            setOpenRecipe(null);
            showToast("Receptet togs bort.");
          };

          const closeAddModal = () => { setShowAddModal(false); setEditingRecipeId(null); };

          const handleSaveRecipe = (data) => {
            if (editingRecipeId) {
              const existing = recipesRef.current.find(r => r.id === editingRecipeId);
              const updated = { ...data, id: editingRecipeId };
              if (existing?.customImage) updated.customImage = existing.customImage; else delete updated.customImage;
              setRecipes(prev => prev.map(r => r.id === editingRecipeId ? updated : r));
              saveRecipeToDb(updated);
              showToast("Receptet uppdaterades!");
            } else {
              const created = { ...data, id: makeId('man') };
              delete created.customImage;
              setRecipes(prev => [...prev, created]);
              saveRecipeToDb(created);
              showToast("Receptet sparades!");
            }
            closeAddModal();
          };

          const triggerImageUpload = (recipeId) => {
            uploadingRecipeIdRef.current = recipeId;
            if (imageUploadRef.current) imageUploadRef.current.click();
          };

          const handleImageFileChange = async (e) => {
            const file = e.target.files?.[0];
            const targetId = uploadingRecipeIdRef.current;
            uploadingRecipeIdRef.current = null;
            if (imageUploadRef.current) imageUploadRef.current.value = '';
            if (!file || !targetId) return;
            try {
              const dataUrl = await resizeImageFile(file, 600, 0.65);
              const current = recipesRef.current.find(r => r.id === targetId);
              if (!current) return;
              const updated = { ...current, customImage: dataUrl };
              setRecipes(prev => prev.map(r => r.id === targetId ? updated : r));
              const ok = await saveRecipeToDb(updated);
              if (ok) showToast("Din bild har sparats i molnet! ☁️");
              else if (!user || !db) showToast("Bilden sparades på den här enheten.");
            } catch (err) {
              console.error('Bilduppladdning:', err);
              showToast('Kunde inte läsa bilden.');
            }
          };

          const handleAiError = (err, context) => {
            if (isApiKeyError(err)) { console.warn(context, err.message); setShowApiModal(true); showToast('Gemini-nyckeln saknas eller är ogiltig. Lägg in den här.'); return; }
            console.error(context, err);
            showToast('Fel: ' + shortError(err));
          };

          const handlePdfUpload = async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            setIsUploadingPdf(true); showToast("Läser in PDF... (kan ta upp till en minut)");
            try {
              const dataUrl = await readFileAsDataURL(file);
              const data = await callGemini(`Extrahera alla recept från denna PDF. ${RECIPE_RULES}`, dataUrl.split(',')[1], "application/pdf", { type: "ARRAY", items: recipeSchema });
              const extracted = (isArray(data) ? data : [data]).filter(r => r && r.name).map(r => normalizeRecipe(r, 'pdf'));
              const existingNames = new Set(recipesRef.current.map(r => (r.name || '').toLowerCase().trim()));
